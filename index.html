      0,.28+Math.random()*.26,0,.4,1.6,0xffc860,-.45);
  }
  sparksBy(sc,.75,0,1.20,0,1.5);
  steamBy(sc,.5,0,1.26,0,.3);
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.28,0,28,0xffb040,1.4,.55,2,.7); }
  sc.n.armR.rot[0]=-.78; sc.n.armL.rot[0]=-.42;
}
/* ---- 滑油：四成热（约120℃）温油里滑散，变玉白即起 ---- */
function doSlide(sc,p,t,b){
  const k = sstep(-.1, b+.02, p);
  placeFoods(sc,'pan',(i,nd,bs)=>{
    /* 低温：气泡极少，食材被筷子轻轻划散 */
    const a=t*2.2+i*.9;
    bs[0]=bs[0]+Math.sin(a)*.030; bs[2]=bs[2]+Math.cos(a)*.024;
    bs[1]=bs[1]+Math.sin(a*1.4)*.008;
    nd.rot[1]=a; nd.rot[0]=0;
    /* 由透明转玉白 */
    nd.scale=[1+k*.08,1+k*.10,1+k*.08];
  });
  /* 温油只有零星小泡 */
  if(Math.random()<.30) sc.emit((Math.random()-.5)*.26,1.15,(Math.random()-.5)*.20,
    0,.10+Math.random()*.08,0,.5,1.2,0xffe8c0,-.3);
  /* 筷子划散 */
  const sp=sc.n.spatulaG;
  sp.pos=[Math.sin(t*2.6)*.13,1.22,.06+Math.cos(t*2.6)*.05];
  sp.rot[2]=.30+Math.sin(t*2.6)*.30;
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.22,0,18,0xfff0d8,1.0,.5,1.9,.7); }
  sc.n.armR.rot[0]=-.60; sc.n.armL.rot[0]=-.40;
}
/* ---- 烫坯：沸水浇淋，毛孔收紧、皮面发亮（不超过10秒） ---- */
function doBlanch(sc,p,t,b){
  const k = sstep(-.1, b+.05, p);
  placeFoods(sc,'pot',(i,nd,bs)=>{
    bs[1]=bs[1]-.03;
    /* 浇淋：整只被顶得轻晃 */
    nd.rot[0]=Math.sin(t*4+i)*.10; nd.rot[2]=Math.cos(t*3.6+i)*.08;
    nd.scale=[1-k*.03,1-k*.02,1-k*.03];     // 皮收紧
  });
  /* 水从上方浇下：勺子来回移动着浇（原来位置写死不动） */
  const sp=sc.n.spoonG;
  sp.pos=[Math.sin(t*3.2)*.13, 1.40-Math.abs(Math.sin(t*3.2))*.06, .04+Math.cos(t*3.2)*.05];
  sp.rot[2]=1.05+Math.sin(t*3.2)*.30;
  for(let i=0;i<3;i++){
    if(Math.random()<.85) sc.emit((Math.random()-.5)*.10,1.30-Math.random()*.22,(Math.random()-.5)*.08,
      (Math.random()-.5)*.06,-.55-Math.random()*.25,(Math.random()-.5)*.06,.4,1.4,0xdfeaf8,1.4);
  }
  steamBy(sc,.85,0,1.28,0,.36);
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.26,0,18,0xe8f4ff,.9,.5,2.0,.8); }
  sc.n.armR.rot[0]=-1.00; sc.n.armL.rot[0]=-.40;
}
/* ---- 调兑汁：碗里按比例调糖醋汁 ---- */
function doSauce(sc,p,t,b){
  const k = sstep(-.1, b+.05, p);
  placeFoods(sc,'none');
  const sau=sc.n.sauce;
  if(sau){ sau.vis=true; sau.pos=[0,1.06,0]; const s2=.5+k*.55; sau.scale=[s2,s2,1]; }
  /* 勺子在碗里画圈搅 */
  const a=t*3.0;
  const sp=sc.n.spoonG;
  sp.pos=[Math.cos(a)*.09,1.16,Math.sin(a)*.06];
  sp.rot[1]=-a; sp.rot[2]=.30;
  /* 调料依次落入 */
  if(k<0.7 && Math.random()<.5) sc.emit(Math.cos(a)*.09,1.30,Math.sin(a)*.06,
    0,-.55,0,.45,1.4,(k<0.35?0xe05040:0xf0d060),2.0);
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.14,0,16,0xc98f3e,.8,.5,1.8,1.0); }
  sc.n.armR.rot[0]=-.80; sc.n.armL.rot[0]=-.35;
}
/* ---- 浇汁：滚烫芡汁浇淋，从头到尾裹匀 ---- */
/* ---- 倒入饮品：拿瓶/罐/杯倾斜，液体流下，锅里那滩跟着涨起来 ---- */
function doPourDrink(sc,p,t,b){
  const dk = drinkOf(Sc.dish);
  const col = dk ? dk.col : 0x8a4a1a;
  MAT.drink.c = col;
  /* 容器：从右侧移到锅上方，边移边倾 */
  const move  = sstep(-.30, b-.30, p);      // 移到位的进度
  const tilt  = sstep(b-.34, b-.02, p);     // 倾倒的进度
  const g = sc.n.drinkG;
  g.vis = true;
  g.pos = [.44-move*.30, 1.18-move*.16, .20-move*.06];
  g.rot[2] = -tilt*1.45;
  g.rot[1] =  .2;
  placeFoods(sc,'pan');
  /* 液流：从瓶口落下，颜色就是这味饮品 */
  const mx = g.pos[0]-.06, my = g.pos[1]+.06;
  if(tilt>.30 && Math.random()<.95){
    const n = 1 + (Math.random()<.5?1:0);
    for(let i=0;i<n;i++)
      sc.emit(mx+(Math.random()-.5)*.03, my-(Math.random()*.04), .14+(Math.random()-.5)*.03,
        (Math.random()-.5)*.03, -.55-Math.random()*.25, (Math.random()-.5)*.03,
        .42, 1.7, col, 2.2);
  }
  /* 锅里的液面：涨上来，颜色同步 */
  const liq = sc.n.drinkS;
  if(liq){
    liq.vis = true;
    const k = Math.min(1, Math.max(0, (p-(b-.34))/((b-.02)-(b-.34))));
    liq.scale=[.18+k*.82, .18+k*.82, 1];
    liq.pos=[0, .018+k*.010, 0];
  }
  /* 碳酸/气泡类会冒白沫；酒类会起蒸汽 */
  if(dk && (dk.key==='cola'||dk.key==='sprite'||dk.key==='fanta'||
            dk.key==='beer'||dk.key==='soda'||dk.key==='sparkling'||
            dk.key==='champagne'||dk.key==='energyd'||dk.key==='craftbeer')){
    steamBy(sc,.30,0,1.16,0,.30);
  }
  if(p>=b && !sc._f){
    sc._f=1; Sc.burst(0,1.12,0,20,col,1.0,.55,2.0,1.3);
  }
  sc.n.armR.rot[0]=-.85-tilt*.35; sc.n.armL.rot[0]=-.30;
}
function doPour(sc,p,t,b){
  const k = sstep(-.12, b+.05, p);
  placeFoods(sc,'none');
  const sau=sc.n.sauce;
  if(sau){ sau.vis=true; sau.pos=[0,1.06,0]; const s2=1-k*.35; sau.scale=[s2,s2,1]; }
  /* 勺子从高处倾倒：汁沿一道弧落下 */
  const sp=sc.n.spoonG;
  const tilt=sstep(-.05,.45,p);
  sp.pos=[-0.14+k*0.30, 1.32-k*.10, .10];
  sp.rot[2]=.35+tilt*1.15; sp.rot[1]=-0.2;
  for(let i=0;i<2;i++){
    if(Math.random()<.8) sc.emit(-0.14+k*0.30+(Math.random()-.5)*.04, 1.26-Math.random()*.16, .10,
      (Math.random()-.5)*.03,-.45-Math.random()*.2,(Math.random()-.5)*.03,.5,1.6,0xd88a3a,1.3);
  }
  steamBy(sc,.35,0,1.16,0,.3);
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.10,0,18,0xd88a3a,.9,.5,1.9,.9); }
  sc.n.armR.rot[0]=-1.00; sc.n.armL.rot[0]=-.40;
}
/* ---- 泡茶：85℃ 水冲泡，茶汤刚出味就滗出 ---- */
function doBrew(sc,p,t,b){
  const k = sstep(-.05, b, p);
  placeFoods(sc,'none');
  /* 茶叶：入水后舒展、上下浮沉 */
  for(let i=0;i<7;i++){
    const nd=sc.foods[i];
    nd.vis=true;
    nd.pos=[sc.org[0]-0.10+Math.sin(t*1.6+i)*.030, sc.org[1]+CT+.10+Math.sin(t*2.2+i*1.4)*.022, sc.org[2]+0.20];
    nd.rot=[t*1.2+i,t*1.6+i,0];
    const g=.5+k*.75; nd.scale=[g*1.4,g*.35,g];   // 叶片舒张开
  }
  /* 注水的细流 */
  if(k<0.5 && Math.random()<.7) sc.emit(-0.10,CT+.34,0.20, 0,-.6,0,.4,1.3,0xdff0e0,1.6);
  /* 茶汤色：由无色转碧绿，过头转黄（这里停在正好） */
  if(Math.random()<.35) sc.emit(-0.10+(Math.random()-.5)*.10,CT+.16,0.20,
    0,.10+Math.random()*.08,0,.8,1.3,0x9ad46a,-.15);
  steamBy(sc,.45,0,CT+.20,0,.22);
  /* 提壶悬在杯口上方注水 */
  const sp=sc.n.spoonG;
  sp.pos=[-0.10+Math.sin(t*1.8)*.03, CT+.42-Math.sin(t*1.8)*.02, .20];
  sp.rot[2]=1.2+Math.sin(t*1.8)*.18;
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,CT+.18,0.20,14,0x9ad46a,.7,.5,1.8,.6); }
  sc.n.armR.rot[0]=-.95-Math.sin(t*1.8)*.10; sc.n.armL.rot[0]=-.45;
}
/* ---- 灌汤：清汤注入盅中，刚好没过食材 ---- */
function doFillsoup(sc,p,t,b){
  const k = sstep(-.1, b+.05, p);
  placeFoods(sc,'pot',(i,nd,bs)=>{ bs[1]=bs[1]-.04; });
  /* 清汤注入：汤面随注入上涨、颜色是清的 */
  const sp2=sc.n.soupS;
  if(sp2){ sp2.vis=true; sp2.pos=[0,.14+k*.06,0]; const s2=.35+k*.65; sp2.scale=[s2,s2,1];
    MAT.soup.c = 0xf0e8cc; }
  const sau=sc.n.sauce; if(sau) sau.vis=false;

  const sp=sc.n.spoonG;
  sp.pos=[Math.sin(t*2.4)*.10, 1.42-Math.sin(t*2.4)*.04, .02+Math.cos(t*2.4)*.05];
  sp.rot[2]=1.15+Math.sin(t*2.4)*.25;
  for(let i=0;i<2;i++){
    if(Math.random()<.8) sc.emit((Math.random()-.5)*.05,1.34-Math.random()*.14,0.04,
      (Math.random()-.5)*.03,-.50-Math.random()*.2,(Math.random()-.5)*.03,.45,1.4,0xf0e8cc,1.2);
  }
  steamBy(sc,.30,0,1.24,0,.3);
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.22,0,16,0xf6ecd8,.8,.5,2.0,.5); }
  sc.n.armR.rot[0]=-1.05; sc.n.armL.rot[0]=-.40;
}
/* ---- 封坛：荷叶封口、覆小碗，一丝不漏 ---- */
function doSeal(sc,p,t,b){
  const k = sstep(b-.35, b+.05, p);
  placeFoods(sc,'none');
  /* 荷叶：从上方盖下，边缘压实 */
  const lid=sc.n.potLid, knob=sc.n.potKnob;
  lid.pos=[0,.26+k*.10,.0]; lid.rot[1]=t*.3; lid.scale=[1+k*.20,1,1+k*.20];
  knob.pos=[0,.29+k*.10,0];
  const sp2=sc.n.soupS;
  if(sp2){ sp2.vis=true; sp2.pos=[0,.165,0]; sp2.scale=[1,1,1]; MAT.soup.c = 0xd8b070; }
  const sau=sc.n.sauce; if(sau) sau.vis=false;
  /* 缝隙冒出的最后一缕酒香 */
  if(k<0.7 && Math.random()<.35) sc.emit((Math.random()-.5)*.22,1.30,(Math.random()-.5)*.16,
    0,.14,0,.7,1.6,0xffe0b0,-.12);
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.34,0,14,0xd8c898,.6,.6,2.2,.3); }
  /* 沿坛口一圈压实 */
  const sp=sc.n.spoonG;
  const a=t*2.6;
  sp.pos=[Math.cos(a)*.13, 1.30+Math.sin(a)*.04, Math.sin(a)*.09];
  sp.rot[1]=-a; sp.rot[2]=.5+Math.sin(a)*.2;
  sc.n.armR.rot[0]=-.85-Math.sin(a)*.12; sc.n.armL.rot[0]=-.60;
}
/* ---- 装坛：分层码放，最易熟的置顶 ---- */
function doLayer(sc,p,t,b){
  const k = sstep(-.1, b+.05, p);
  /* 食材一层层落进坛里：先底层、再中层、最后顶层 */
  const nTotal=7;
  placeFoods(sc,'pot',(i,nd,bs)=>{
    const e=Math.max(0,Math.min(1,(k-i*0.10)*2.0));
    const layer=(i<3)?0:(i<5)?1:2;
    bs[0]=bs[0]*.55; bs[2]=bs[2]*.55;
    bs[1]=1.10+layer*.055+(1-e)*.40;          // 从高处落到各自那一层
    nd.scale=[1,1,1];
    nd.rot[1]=i*.7;
  });
  const sp2=sc.n.soupS;
  if(sp2){ sp2.vis=true; sp2.pos=[0,.165,0]; sp2.scale=[1,1,1]; MAT.soup.c = 0xd0a868; }
  const sau=sc.n.sauce; if(sau) sau.vis=false;
  if(Math.random()<.3) sc.emit((Math.random()-.5)*.14,1.24,(Math.random()-.5)*.10,
    0,.10,0,.5,1.2,0xffd9a0,-.2);
  /* 手在坛口上方一层层码放 */
  const sp=sc.n.spoonG;
  const a=t*2.0;
  sp.pos=[Math.cos(a)*.11, 1.36+Math.sin(t*3)*.03, Math.sin(a)*.07];
  sp.rot[1]=-a; sp.rot[2]=.35+Math.sin(t*3)*.22;
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.26,0,16,0xffdca8,.8,.5,1.9,.6); }
  sc.n.armR.rot[0]=-.70-Math.sin(t*3)*.18; sc.n.armL.rot[0]=-.50;
}

/* ---------- 特效按食材分化 ----------

   现在：切菜的碎屑是食材本色，火花的多少看油水，蒸汽看含水量。 */
const FX_BY_ING = {
  /* 碎屑色（切/断时溅出的末子） */

    leafy:0x8fd45a, root:0xe8d9a8, meat:0xc9705a, fish:0xe8d8d0, shrimp:0xf08060,

    melon:0x7ac05a, shoot:0xe8a050, fruit:0xe05040, berry:0xc08a4a,
    mush:0xb09068, shell:0xe8c8a0, dairy:0xf5e0a0, powder:0xf5f0e0,
    nest:0xf0e4c0, soup:0xe8dcb8
  },
  /* 汁水色（受热/受压时溅出的液体） */
  juice:{
    leafy:0x9ad46a, root:0xe0d0a0, meat:0xd08060, fish:0xf0e0d0, shrimp:0xf89070,

    melon:0x8ad060, shoot:0xf0b060, fruit:0xe86040, berry:0xd0a060,
    mush:0xc0a078, shell:0xf0d8b0, dairy:0xf8ecc0, powder:0xf8f4e8,
    nest:0xf4eccc, soup:0xf0e8d0
  },
  /* 蒸汽量：含水多的冒得凶（叶菜/菇），干货几乎不冒 */
  steam:{
    leafy:1.5, mush:1.4, melon:1.2, soup:1.6, noodle:1.2, grain:1.1,
    root:0.9, shoot:0.9, fruit:0.8, egg:0.6, tofu:0.6, meat:0.7,
    fish:0.8, shrimp:0.7, shell:0.7, dairy:0.5, berry:0.5,
    powder:0.25, nest:0.5
  },
  /* 火花量：油多/易焦的爆得多（肉/面/坚果），汤水类几乎没有 */
  spark:{
    meat:1.5, berry:1.6, noodle:1.3, grain:1.2, tofu:0.9, melon:1.0,
    shoot:1.0, root:1.0, shrimp:1.1, shell:0.8, fish:0.7, egg:0.6,
    leafy:0.5, mush:0.5, fruit:0.4, dairy:0.2, powder:0.1, nest:0.1, soup:0.0
  }
};
function fxCrumb(cat){ return (FX_BY_ING.crumb[cat]!==undefined) ? FX_BY_ING.crumb[cat] : 0xf0e0b0; }
function fxJuice(cat){ return (FX_BY_ING.juice[cat]!==undefined) ? FX_BY_ING.juice[cat] : 0xffd9a0; }
function fxSteam(cat){ return (FX_BY_ING.steam[cat]!==undefined) ? FX_BY_ING.steam[cat] : 1.0; }
function fxSpark(cat){ return (FX_BY_ING.spark[cat]!==undefined) ? FX_BY_ING.spark[cat] : 1.0; }
/* 蒸汽：按食材含水量调密度与颜色 */
function steamBy(sc, base, x,y,z, spread, up){
  const cat = Sc._shapeCat || 'root';
  const k = fxSteam(cat);
  if(k<=0.02) return;
  const col = fxJuice(cat);
  steamPuff(sc, base*k, x,y,z, spread, (k>1 ? col : 0xffffff), up);
}
/* 火花：按食材的"易焦度"调密度 */
function sparksBy(sc, base, x,y,z, spd){
  const cat = Sc._shapeCat || 'root';
  const k = fxSpark(cat);
  if(k<=0.02) return;
  sparks(sc, base*k, x,y,z, spd, 0xffc45a);
}

/* ---------- 汽蒸 / 烘烤：食材在笼里、炉里的变化 ---------- */
const STEAM_BY_ING = {
  /* 叶菜：蒸到塌软、颜色转深 */
  leafy(sc,i,nd,bs,k){ nd.scale=[1+k*.12, 1-k*.44, 1+k*.12]; },
  /* 肉：蒸到酥烂、体积微缩 */
  meat(sc,i,nd,bs,k){  nd.scale=[1-k*.12, 1-k*.14, 1-k*.12]; },
  /* 鱼：蒸后整条保持，只眼珠突出（微抬） */
  fish(sc,i,nd,bs,k){  bs[1]=bs[1]+k*.006; nd.scale=[1+k*.05,1,1+k*.05]; },
  /* 虾：蒸后蜷得更紧 */
  shrimp(sc,i,nd,bs,k){ nd.rot[1]=-.4-k*1.3; nd.scale=[1-k*.22,1,1-k*.22]; },
  /* 豆腐 / 蛋：蒸后膨润 */
  tofu(sc,i,nd,bs,k){  nd.scale=[1+k*.10,1+k*.12,1+k*.10]; },
  egg(sc,i,nd,bs,k){   nd.scale=[1+k*.16,1+k*.18,1+k*.16]; },
  /* 米 / 面：吸水上劲 */
  grain(sc,i,nd,bs,k){  nd.scale=[1+k*.14,1+k*.20,1+k*.14]; },
  noodle(sc,i,nd,bs,k){ nd.scale=[1+k*.16,1+k*.10,1+k*.16]; },
  /* 燕窝：发头最大，涨成好几倍 */
  nest(sc,i,nd,bs,k){ nd.scale=[1+k*.55,1+k*.70,1+k*.55]; },
  /* 带壳：蒸到张壳 */
  shell(sc,i,nd,bs,k){ nd.rot[0]=-k*.70; nd.scale=[1,1+k*.26,1]; },
  /* 香菇：蒸后塌成薄片 */
  mush(sc,i,nd,bs,k){  nd.scale=[1+k*.16,1-k*.52,1+k*.16]; },
  /* 块茎：蒸到绵软 */
  root(sc,i,nd,bs,k){  nd.scale=[1+k*.08,1-k*.10,1+k*.08]; },
  /* 瓜果 / 锥 / 果 / 粒 / 奶 / 粉 / 汤：通用微变 */
  melon(sc,i,nd,bs,k){ nd.scale=[1+k*.06,1-k*.12,1+k*.06]; },
  shoot(sc,i,nd,bs,k){ nd.scale=[1+k*.06,1-k*.10,1+k*.06]; },
  fruit(sc,i,nd,bs,k){ nd.scale=[1+k*.08,1-k*.14,1+k*.08]; },
  berry(sc,i,nd,bs,k){ nd.scale=[1+k*.10,1+k*.10,1+k*.10]; },
  dairy(sc,i,nd,bs,k){ nd.scale=[1-k*.20,1-k*.26,1-k*.20]; },
  powder(sc,i,nd,bs,k){ nd.scale=[1+k*.12,1+k*.14,1+k*.12]; },
  soup(sc,i,nd,bs,k){ nd.scale=[1,1,1]; }
};
/* 蒸：笼盖被蒸汽顶起，食材在笼内变化 */
function doSteam(sc,p,t,b){
  const cat = Sc._shapeCat || 'root';
  const fn  = STEAM_BY_ING[cat] || STEAM_BY_ING.root;
  const k = gauss(p,b,0.15);
  sc.n.stLid.pos[1]=1.335+k*.045;
  placeFoods(sc,'pot',(i,nd,bs)=>{
    bs[1]=bs[1]-.30;                      // 从灶台高度挪进蒸笼
    bs[0]=bs[0]+(i%3-1)*.055; bs[2]=bs[2]+((i/3)|0)*.052-.05;
    fn(sc,i,nd,bs,k);
  });
  steamBy(sc,1.0,0,1.42,0,.7);
  steamBy(sc,.7,-.24,1.30,0,.6);
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.46,0,26,0xffffff,1.2,.8,2.4,0.2); }
  sc.n.armR.rot[0]=-.6; sc.n.armL.rot[0]=-.4;
}
/* 烤：食材在炉里上色、表皮收紧 */
const BAKE_BY_ING = {
  /* 鸭 / 肉：皮面收紧、上糖色、出炉时油亮 */
  meat(sc,i,nd,k){ nd.scale=[1-k*.10,1-k*.06,1-k*.10]; nd.rot[1]=k*.18; },
  duck(sc,i,nd,k){ nd.scale=[1-k*.10,1-k*.06,1-k*.10]; nd.rot[1]=k*.18; },
  /* 甜点 / 奶制品：受热膨胀，峰值落在节拍点（出炉那一刻最鼓） */
  dairy(sc,i,nd,k){ nd.scale=[1+k*.22,1+k*.34,1+k*.22]; },
  /* 面粉类：膨发最猛 */
  powder(sc,i,nd,k){ nd.scale=[1+k*.28,1+k*.40,1+k*.28]; },
  /* 块茎：烤到缩水、皮皱 */
  root(sc,i,nd,k){   nd.scale=[1-k*.14,1-k*.10,1-k*.14]; },
  /* 巧克力：融化 */
  chocolate(sc,i,nd,k){ nd.scale=[1-k*.24,1-k*.42,1-k*.24]; },
  /* 坚果：上色、微跳 */
  berry(sc,i,nd,k){ nd.scale=[1-k*.06,1-k*.06,1-k*.06];
    nd.pos[1]=nd.pos[1]+Math.abs(Math.sin(i+k*6))*.004; },
  /* 长条 / 果 / 鱼 / 其他：通用上色 */
  melon(sc,i,nd,k){ nd.scale=[1-k*.12,1-k*.08,1-k*.12]; },
  fruit(sc,i,nd,k){ nd.scale=[1-k*.12,1-k*.12,1-k*.12]; },
  fish(sc,i,nd,k){  nd.scale=[1-k*.08,1,1-k*.08]; },
  leafy(sc,i,nd,k){ nd.scale=[1-k*.10,1-k*.40,1-k*.10]; },
  shell(sc,i,nd,k){ nd.rot[0]=-k*.50; nd.scale=[1,1+k*.18,1]; },
  tofu(sc,i,nd,k){  nd.scale=[1-k*.08,1-k*.06,1-k*.08]; },
  mushroom(sc,i,nd,k){ nd.scale=[1-k*.10,1-k*.46,1-k*.10]; },
  noodle(sc,i,nd,k){ nd.scale=[1,1-k*.06,1]; },
  grain(sc,i,nd,k){ nd.scale=[1,1-k*.08,1]; },
  egg(sc,i,nd,k){ nd.scale=[1-k*.06,1+k*.12,1-k*.06]; },
  shoot(sc,i,nd,k){ nd.scale=[1-k*.10,1-k*.08,1-k*.10]; },
  nest(sc,i,nd,k){ nd.scale=[1,1-k*.08,1]; },
  soup(sc,i,nd,k){ nd.scale=[1,1,1]; }
};
function doBake(sc,p,t,b){
  const cat = Sc._shapeCat || 'root';
  const fn  = BAKE_BY_ING[cat] || BAKE_BY_ING.root;
  const k = sstep(b-.35,b,p);
  sc.n.ovenDoorP.rot[0]=k*0.95;
  placeFoods(sc,'oven',(i,nd,bs)=>{ bs[2]=bs[2]+k*.24; fn(sc,i,nd,k); });
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.0,.3,22,0xffb060,1.0,.7,2,.5); }
  steamPuff(sc,.35,0,1.14,.4,.5,0xffcf9a,.4);
  sc.n.armR.rot[0]=-.8; sc.n.armL.rot[0]=-.3;
}
/* 冷藏：不同食材的"冻感"不同 */
const CHILL_BY_ING = {
  /* 刺身类：冻到挺括、表面结霜 */
  fish(sc,i,nd,k){ nd.scale=[1+k*.04,1+k*.02,1+k*.04]; nd.rot[2]=k*.10; },
  shell(sc,i,nd,k){ nd.scale=[1+k*.04,1,1+k*.04]; },
  /* 甜点：冻实 */
  dairy(sc,i,nd,k){ nd.scale=[1-k*.06,1-k*.04,1-k*.06]; },
  /* 果：冻硬 */
  fruit(sc,i,nd,k){ nd.scale=[1-k*.05,1-k*.05,1-k*.05]; },
  /* 叶菜：冻蔫 */
  leafy(sc,i,nd,k){ nd.scale=[1-k*.05,1-k*.20,1-k*.05]; },
  /* 其他：微缩 */
  root(sc,i,nd,k){ nd.scale=[1-k*.04,1-k*.04,1-k*.04]; },
  meat(sc,i,nd,k){ nd.scale=[1-k*.04,1-k*.04,1-k*.04]; },
  tofu(sc,i,nd,k){ nd.scale=[1-k*.03,1-k*.03,1-k*.03]; },
  berry(sc,i,nd,k){ nd.scale=[1-k*.04,1-k*.04,1-k*.04]; },
  melon(sc,i,nd,k){ nd.scale=[1-k*.04,1-k*.04,1-k*.04]; },
  grain(sc,i,nd,k){ nd.scale=[1-k*.03,1-k*.03,1-k*.03]; },
  egg(sc,i,nd,k){ nd.scale=[1-k*.03,1-k*.03,1-k*.03]; },
  shoot(sc,i,nd,k){ nd.scale=[1-k*.04,1-k*.04,1-k*.04]; },
  noodle(sc,i,nd,k){ nd.scale=[1,1-k*.03,1]; },
  mush(sc,i,nd,k){ nd.scale=[1-k*.04,1-k*.14,1-k*.04]; },
  shrimp(sc,i,nd,k){ nd.rot[1]=-k*.30; },
  nest(sc,i,nd,k){ nd.scale=[1-k*.03,1,1-k*.03]; },
  soup(sc,i,nd,k){ nd.scale=[1,1,1]; },
  powder(sc,i,nd,k){ nd.scale=[1-k*.03,1-k*.03,1-k*.03]; }
};
function doChill(sc,p,t,b){
  const cat = Sc._shapeCat || 'root';
  const fn  = CHILL_BY_ING[cat] || CHILL_BY_ING.root;
  const k = sstep(b-.4,b,p);
  sc.n.fridgeDoorP.rot[1] = 1.05*sstep(0.02,0.34,p);
  placeFoods(sc,'bowl',(i,nd,bs)=>{ fn(sc,i,nd,k); });
  for(let i=0;i<10;i++){
    const nd=sc.n['ice'+i];
    if(i<Math.floor(k*10+0.01) && p>=b-.4){ nd.vis=true;
      const a=i/10*Math.PI*2;
      nd.pos=[sc.org[0]+Math.cos(a)*.13, .99+(i%2)*.03, sc.org[2]+.44+Math.sin(a)*.09];
      nd.rot=[t*.5+i, t*.7+i, 0]; nd.scale=[.5+k*.7,.5+k*.7,.5+k*.7]; }
    else nd.vis=false;
  }
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,.95,.44,20,0xd8f0ff,.7,.7,2,.4); }
  sc.n.armR.rot[0]=-.3; sc.n.armL.rot[0]=-.3;
}

/* ---------- 火工：食材在锅里的"脾气"各不相同 ----------
   叶子菜会塌、肉块会收缩、虾会卷、豆腐得轻推、米饭得抖散…… */
const HEAT_BY_ING = {
  /* 绿叶菜：受热塌缩、出水，翻炒时是"压"下去而不是弹起来 */
  leafy(sc,i,nd,bs,t,k,mode){
    bs[1] = bs[1] - k*0.018;
    bs[0] = bs[0] + Math.sin(t*6+i*1.3)*.045;
    nd.scale = [1+k*.10, 1-k*.42, 1+k*.10];
    if(mode==='toss') nd.rot[0] = Math.sin(t*7+i)*.35;
  },
  /* 肉：遇热收紧、边缘微焦，颠锅时整块翻 */
  meat(sc,i,nd,bs,t,k,mode){
    bs[1] = bs[1] + (mode==='flame'? k*.05 : 0);
    nd.scale = [1-k*.16, 1-k*.10, 1-k*.16];
    if(mode==='toss') nd.rot[0] = k*Math.PI;
    if(mode==='fry')  nd.rot[1] = k*1.9;
  },
  /* 豆腐：易碎，动作要轻 —— 位移幅度只有别人一半，且不下落 */
  tofu(sc,i,nd,bs,t,k,mode){
    const amp = mode==='toss' ? .012 : .030;
    bs[0] = bs[0] + Math.sin(t*4.2+i)*amp;
    bs[1] = bs[1] + (mode==='toss' ? k*.30 : Math.abs(Math.sin(t*4.2+i))*0.012);
    if(mode==='fry') nd.rot[1]=i*.5;
  },
  /* 虾：受热卷成 C 形 */
  shrimp(sc,i,nd,bs,t,k,mode){
    bs[0] = bs[0] + Math.sin(t*6+i)*.04;
    nd.rot[1] = -k*1.5;
    nd.scale = [1-k*.20, 1, 1-k*.20];
    if(mode==='toss') nd.rot[0] = k*Math.PI;
  },
  /* 鱼：煎制时不翻动（翻面靠整片铲起），只做轻微摆动 */
  fish(sc,i,nd,bs,t,k,mode){
    /* 煎鱼不翻身 —— 上面那道 flip 要撤掉，整片鱼只做轻微摆动 */
    if(mode==='fry'){ nd.rot[0]=0; nd.rot[1] = Math.sin(t*2+i)*.06; return; }
    bs[0] = bs[0] + Math.sin(t*5+i)*.030;
    if(mode==='toss') nd.rot[2] = k*Math.PI*.7;
  },
  /* 米 / 面条：要抖散，不然坨在一起 —— 翻炒幅度最大 */
  grain(sc,i,nd,bs,t,k,mode){
    bs[0] = bs[0] + Math.sin(t*9+i*2.1)*.070;
    bs[1] = bs[1] + Math.abs(Math.sin(t*9+i))*0.055;
    if(mode==='toss') nd.rot[1] = k*2.2;
  },
  noodle(sc,i,nd,bs,t,k,mode){
    bs[0] = bs[0] + Math.sin(t*8+i*1.7)*.062;
    bs[1] = bs[1] + Math.abs(Math.sin(t*8+i))*0.046;
    nd.rot[2] = Math.sin(t*7+i)*.30;
  },
  /* 带壳海鲜：受热张壳、变色 */
  shell(sc,i,nd,bs,t,k,mode){
    bs[0] = bs[0] + Math.sin(t*5+i)*.035;
    nd.rot[0] = -k*0.55;
    nd.scale = [1, 1+k*.22, 1];
    if(mode==='flame') nd.rot[1]=k*.8;
  },
  /* 块茎：切丝后是"抖"，切块后是"翻" */
  root(sc,i,nd,bs,t,k,mode){
    bs[0] = bs[0] + Math.sin(t*6+i*1.3)*.055;
    bs[1] = bs[1] + Math.abs(Math.sin(t*6+i))*0.050;
    if(mode==='toss') nd.rot[0] = k*Math.PI*.9;
  },
  /* 香菇：出水后塌成薄片 */
  mush(sc,i,nd,bs,t,k,mode){
    bs[0] = bs[0] + Math.sin(t*5+i)*.040;
    nd.scale = [1+k*.14, 1-k*.50, 1+k*.14];
  },
  /* 长条瓜果：锅里是"拨" */
  melon(sc,i,nd,bs,t,k,mode){
    bs[0] = bs[0] + Math.sin(t*6+i)*.052;
    nd.rot[1] = Math.sin(t*5+i)*.40;
    if(mode==='toss') nd.rot[0]=k*Math.PI;
  },
  /* 蛋：凝固、蓬松 */
  egg(sc,i,nd,bs,t,k,mode){
    bs[0] = bs[0] + Math.sin(t*6+i)*.042;
    nd.scale = [1+k*.28, 1+k*.16, 1+k*.28];
  },
  /* 颗粒小料：蹦跳 */
  berry(sc,i,nd,bs,t,k,mode){
    bs[0] = bs[0] + Math.sin(t*10+i*2.4)*.058;
    bs[1] = bs[1] + Math.abs(Math.sin(t*10+i))*0.062;
    if(mode==='toss') nd.rot[0]=k*Math.PI*1.2;
  },
  /* 锥 / 果 / 粒 / 粉 / 奶 / 汤 / 燕窝：通用轻翻 */
  shoot(sc,i,nd,bs,t,k,mode){
    bs[0]=bs[0]+Math.sin(t*6+i*1.3)*.050; bs[1]=bs[1]+Math.abs(Math.sin(t*6+i))*0.046;
  },
  fruit(sc,i,nd,bs,t,k,mode){
    bs[0]=bs[0]+Math.sin(t*6+i*1.3)*.048; bs[1]=bs[1]+Math.abs(Math.sin(t*6+i))*0.044;
    nd.scale=[1-k*.08,1-k*.08,1-k*.08];
  },
  dairy(sc,i,nd,bs,t,k,mode){
    bs[0]=bs[0]+Math.sin(t*5+i)*.038;
    nd.scale=[1-k*.30,1-k*.42,1-k*.30];   // 受热融化
  },
  powder(sc,i,nd,bs,t,k,mode){ bs[0]=bs[0]+Math.sin(t*5+i)*.030; },
  nest(sc,i,nd,bs,t,k,mode){ bs[0]=bs[0]+Math.sin(t*4+i)*.018; },
  soup(sc,i,nd,bs,t,k,mode){ bs[0]=bs[0]+Math.sin(t*4+i)*.018; }
};
/* ---------- 成品造型：装盘时菜在盘里的摆法 ----------
   "一盘炒青菜"和"一盘松鼠鳜鱼"摆法完全不同：
   丝是堆、块是码、鱼是卧、虾是围、汤是盛。 */
const PLATE_BY_ING = {
  /* 叶菜：松散堆在盘心 */
  leafy(i,nd,P,k){
    const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.105*k, P[1]+.045+((i%3)-1)*.016, P[2]+Math.sin(a)*.075*k];
  },
  /* 肉块：码成整齐的两排 */
  meat(i,nd,P,k){
    const gx=i%3, gy=(i/3)|0;
    return [P[0]+(gx-1)*.115*k, P[1]+.042, P[2]+(gy-1)*.085*k];
  },
  /* 豆腐：方阵码放（文思豆腐那种规矩） */
  tofu(i,nd,P,k){
    const gx=i%3, gy=(i/3)|0;
    return [P[0]+(gx-1)*.088*k, P[1]+.040, P[2]+(gy-1)*.070*k];
  },
  /* 鱼：整条卧在盘中央，头尾顺着盘的长轴 */
  fish(i,nd,P,k){
    if(i===0) return [P[0], P[1]+.052, P[2]];
    const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.130*k, P[1]+.040, P[2]+Math.sin(a)*.055*k];
  },
  /* 虾：沿盘沿围成一圈，头朝内 */
  shrimp(i,nd,P,k){
    const a=i/7*Math.PI*2 - Math.PI/2;
    return [P[0]+Math.cos(a)*.130*k, P[1]+.040, P[2]+Math.sin(a)*.092*k];
  },
  /* 带壳：壳朝上，摆成花瓣状 */
  shell(i,nd,P,k){
    const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.118*k, P[1]+.046, P[2]+Math.sin(a)*.084*k];
  },
  /* 米饭 / 面条：堆成小山 */
  grain(i,nd,P,k){
    const a=i/7*Math.PI*2, r=(1-i/9)*.10;
    return [P[0]+Math.cos(a)*r*k, P[1]+.040+i*.011, P[2]+Math.sin(a)*r*.7*k];
  },
  noodle(i,nd,P,k){
    const a=i/7*Math.PI*2, r=(1-i/9)*.11;
    return [P[0]+Math.cos(a)*r*k, P[1]+.038+i*.010, P[2]+Math.sin(a)*r*.7*k];
  },
  /* 块茎：散铺 */
  root(i,nd,P,k){
    const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.112*k, P[1]+.042, P[2]+Math.sin(a)*.080*k];
  },
  /* 香菇 / 瓜果 / 锥 / 果 / 粒：圆盘均布 */
  mush(i,nd,P,k){  const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.108*k, P[1]+.040, P[2]+Math.sin(a)*.078*k]; },
  melon(i,nd,P,k){ const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.112*k, P[1]+.040, P[2]+Math.sin(a)*.078*k]; },
  shoot(i,nd,P,k){ const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.108*k, P[1]+.040, P[2]+Math.sin(a)*.078*k]; },
  fruit(i,nd,P,k){ const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.108*k, P[1]+.044, P[2]+Math.sin(a)*.078*k]; },
  berry(i,nd,P,k){ const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.114*k, P[1]+.038, P[2]+Math.sin(a)*.082*k]; },
  /* 蛋 / 奶 / 粉 / 燕窝 / 汤：居中成一坨 */
  egg(i,nd,P,k){  const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.070*k, P[1]+.036, P[2]+Math.sin(a)*.052*k]; },
  dairy(i,nd,P,k){ const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.088*k, P[1]+.038, P[2]+Math.sin(a)*.064*k]; },
  powder(i,nd,P,k){ const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.088*k, P[1]+.036, P[2]+Math.sin(a)*.064*k]; },
  nest(i,nd,P,k){ const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.086*k, P[1]+.038, P[2]+Math.sin(a)*.062*k]; },
  soup(i,nd,P,k){ const a=i/7*Math.PI*2;
    return [P[0]+Math.cos(a)*.080*k, P[1]+.036, P[2]+Math.sin(a)*.058*k]; }
};
/* 装盘：菜从锅里划弧落进盘子，落点由成品造型决定 */
function doPlate(sc,p,t,b){
  const cat = Sc._shapeCat || 'root';
  const fn  = PLATE_BY_ING[cat] || PLATE_BY_ING.root;
  const k   = sstep(b-.34, b+.02, p);
  const P   = STATION.plating.org;
  const panX=P[0]-0.36, panY=1.16-k*0.04, panZ=P[2]+0.04;
  sc.n.panG.pos=[panX, panY, panZ]; sc.n.panG.rot[2]=k*0.95;
  for(let i=0;i<7;i++){
    const nd=sc.foods[i];
    const bs=sc.foodBase('pan',i);
    const e=Math.max(0,Math.min(1,(k-i*0.055)*1.5));
    const [rx,ry]=rot2(bs[0], bs[1]-1.08, k*0.95);
    const arc=Math.sin(e*Math.PI)*0.12;
    nd.vis=true;
    const tgt=fn(i,nd,P,k);
    nd.pos[0]=(panX+rx)*(1-e) + tgt[0]*e;
    nd.pos[1]=(panY+ry+0.04)*(1-e) + tgt[1]*e + arc;
    nd.pos[2]=(panZ+bs[2])*(1-e)   + tgt[2]*e;
    nd.rot[1]=i*.5; nd.rot[0]=e*1.2;
  }
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,CT+.1,0,16,0xffe6b0,.8,.5,1.8,2.0); }
  steamPuff(sc,.3,0,CT+.12,0,.3,0xffffff,.4);
  sc.n.armR.rot[0]=-.95; sc.n.armL.rot[0]=-.5;
}

/* 火工四连：翻炒 / 颠锅 / 煎制 / 喷枪 */
function doStir(sc,p,t,b,mode){
  const cat = Sc._shapeCat || 'root';
  const fn  = HEAT_BY_ING[cat] || HEAT_BY_ING.root;
  const cyc = Math.sin(t*7);
  const k   = sstep(b-.38, b-.02, p);

  if(mode==='toss'){
    const tilt = -0.20 + 0.62*gauss(p,b-0.06,0.17);
    const h = gauss(p,b,0.19);
    sc.n.panG.rot[2]=tilt; sc.n.panG.pos[1]=1.0 + h*0.06;
    placeFoods(sc,'pan',(i,nd,bs)=>{
      const [rx,ry]=rot2(bs[0], bs[1]-1.08, tilt);
      bs[0]=rx; bs[1]=1.08+ry + h*0.55;
      fn(sc,i,nd,bs,t,k,'toss');
    });
    sparksBy(sc, p>b-.25&&p<b+.3 ? 1.0 : .3, 0,1.2+h*.5,0,1.6);
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.5,0,Math.round(24*Math.max(.5,fxSpark(Sc._shapeCat||'root'))),0xffd27a,1.4,.6,2,1.2); }
    sc.n.armR.rot[0]=-.9+ 0.6*gauss(p,b-.1,0.18); sc.n.armL.rot[0]=-.5;
    return;
  }
  if(mode==='fry'){
    const flip = sstep(b-0.18, b+0.18, p);
    placeFoods(sc,'flat',(i,nd,bs)=>{
      /* 默认整片翻面；特殊食材（鱼/豆腐）走自己的分支 */
      bs[1] = bs[1] + Math.sin(flip*Math.PI)*0.10;
      nd.rot[0] = flip*Math.PI*2; nd.rot[1] = i*.6;
      fn(sc,i,nd,bs,t,flip,'fry');
    });
    sc.n.spatulaG.pos=[.14,1.16,.06]; sc.n.spatulaG.rot[2]=.2;
    if(Math.random()<.7) sc.emit((Math.random()-.5)*.28,1.06,(Math.random()-.5)*.2,0,.2,0,.3,1.3,0xffffff,-.2);
    steamPuff(sc,.5,0,1.12,0,.28,0xffffff,.4);
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.14,0,16,0xffe0a0,1.0,.5,2,1.2); }
    sc.n.armR.rot[0]=-.5; sc.n.armL.rot[0]=-.3;
    return;
  }
  if(mode==='flame'){
    const k2 = gauss(p,b,0.13);
    sc.n.torchG.pos=[.5,1.26+k2*.05,.1]; sc.n.torchG.rot[2]=-.55-k2*.15;
    sc.n.torchF.scale=[1, .8+k2*1.4, 1]; sc.n.torchF.vis=p>b-.5;
    placeFoods(sc,'pan',(i,nd,bs)=>{ bs[1]=bs[1]+Math.sin(t*5+i)*.008+k2*.05; fn(sc,i,nd,bs,t,k2,'flame'); });
    sparks(sc,p>b-.35&&p<b+.25?1.0:.4,-.05,1.16,0,1.8,0xff8a3d);
    steamPuff(sc,.6,0,1.22,0,.3,0x6a5a52,.6);
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(-.05,1.2,0,26,fxJuice(Sc._shapeCat||'root'),1.5,.6,2,0.8); }
    sc.n.armR.rot[0]=-1.0; sc.n.armL.rot[0]=-.4;
    return;
  }
  /* 翻炒 */
  placeFoods(sc,'pan',(i,nd,bs)=>{ fn(sc,i,nd,bs,t,k,'stirfry'); });
  sc.n.spatulaG.pos=[cyc*.12,1.22,.10+cyc*.08]; sc.n.spatulaG.rot[2]=.3+cyc*.35;
  sparksBy(sc,.9,0,1.14,0,1.4);
  steamBy(sc,.5,0,1.22,0,.6);
  if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.22,0,20,fxJuice(Sc._shapeCat||'root'),1.3,.55,2,1.0); }
  sc.n.armR.rot[0]=-.75+cyc*.25; sc.n.armL.rot[0]=-.3;
}

function doCut(sc,p,t,b,mode){
  const cat = Sc._shapeCat || 'root';
  const fn  = CUT_BY_ING[cat] || CUT_BY_ING.root;
  let lead, lift, rest, twist, burstN;
  switch(mode){
    case 'shred': lead=.16; lift=.26; rest=.01; twist=-.16; burstN=18; break;  // 快刀连切
    case 'score': lead=.30; lift=.30; rest=.02; twist=-.05; burstN=12; break;  // 斜刀剞
    case 'carve': lead=.34; lift=.32; rest=.02; twist=-0.30; burstN=14; break; // 片薄片
    case 'dice':  lead=.32; lift=.32; rest=.02; twist=-0.45; burstN=14; break;
    case 'slice': lead=.34; lift=.34; rest=.02; twist=-0.30; burstN=10; break;
    default:      lead=.30; lift=.30; rest=.02; twist=-0.12; burstN=10;
  }
  /* 切丝是"连刀"：刀高频起落，不是慢悠悠一下 */
  if(mode==='shred' || mode==='score'){
    const cyc = Math.abs(Math.sin(p*40));
    knifeCycle(sc,p,b,lead,lift,rest,twist);
    sc.n.knifeG.pos[1] += cyc*0.03;
  } else {
    knifeCycle(sc,p,b,lead,lift,rest,twist);
  }
  sc.n.armL.rot[0] = (mode==='slice'||mode==='dice') ? -.5 : (mode==='carve'? -.6 : -.35);
  fn(sc,p,t,b,mode);
  if(p>=b&&!sc._f){
    sc._f=1;
    Sc.burst(0,CT+.09,.18,burstN, fxCrumb(Sc._shapeCat||'root'), (mode==='shred'?.7:.85), .4, 1.7, 3.0);
  }
}

const ANIM = {

  },

    const k = sstep(b-0.20, b, p);

    sc.n.armR.rot[2] = -0.25*k;
    sc.n.armL.rot[0] = -.3;
    placeFoods(sc,'none');
    const lit = sstep(b-0.02, b+0.10, p);
    sc._kindleLit = lit;

      sc.emit((Math.random()-.5)*.35, 1.02+Math.random()*.1, (Math.random()-.5)*.25,
        (Math.random()-.5)*1.0, .6+Math.random()*.8, (Math.random()-.5)*1.0, .5, 1.6, 0xffb347, .6, 'spark');

  },
  wash(sc,p,t,b){ doWash(sc,p,t,b); },

  shred(sc,p,t,b){ doCut(sc,p,t,b,'shred'); },
  score(sc,p,t,b){ doCut(sc,p,t,b,'score'); },
  carve(sc,p,t,b){ doCut(sc,p,t,b,'carve'); },
  /* 吊清汤：汤勺贴着汤面撇浮沫，撇过的地方汤色转清亮 */
  clarify(sc,p,t,b){
    const k = sstep(b-.44, b-.02, p);
    const sw = Math.sin(p*13);
    sc.n.spoonG.pos=[sw*.09, 1.24, .02+k*.02];
    sc.n.spoonG.rot[2]=.15+sw*.18;
    placeFoods(sc,'pot',(i,nd,bs)=>{ bs[1]=bs[1]-.02+Math.sin(t*4+i)*.006; });
    steamPuff(sc,.9,0,1.30,0,.30,0xfff2dc,.55);
    /* 浮沫随进度被撇掉 */
    for(let i=0;i<6;i++){
      const nd=sc.n['ice'+i];
      nd.vis = (i/6) > k;
      if(nd.vis){ nd.pos=[Math.cos(i*1.7)*.10+sc.org[0], 1.235+sc.org[1], Math.sin(i*1.7)*.08+sc.org[2]];
        nd.scale=[.7,.5,.7]; }
    }
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.28,0,20,0xfff4e0,.9,.5,1.9,1.0); }
    sc.n.armR.rot[0]=-.95; sc.n.armL.rot[0]=-.3;
  },
  /* 填料：把馅料塞进腔体，塞满后表面鼓起 */
  stuff(sc,p,t,b){
    const k = sstep(b-.42, b-.04, p);
    placeFoods(sc,'board',(i,nd,bs)=>{
      bs[0]=-0.16+i*0.052; bs[2]=0.14+(i%2)*0.05;
      nd.pos[1] = bs[1]+sc.org[1] + (i/7)*k*0.05;
      nd.pos[0] = bs[0]+sc.org[0] - Math.sin(p*9+i)*0.012*(1-k);
      nd.scale=[1-k*.18, 1+k*.30, 1-k*.18];
    });
    sc.n.armR.rot[0]=-.75-Math.sin(p*11)*.18; sc.n.armL.rot[0]=-.62;
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,CT+.11,.16,14,0xf2e4c0,.7,.45,1.7,2.6); }
  },
  /* 上糖色：刷子扫过表面，皮面由浅转亮 */
  pickle(sc,p,t,b){
    const k = sstep(b-.40, b-.04, p);
    const sw = Math.sin(p*12);
    placeFoods(sc,'board',(i,nd,bs)=>{
      bs[0]=-0.18+i*0.058; bs[2]=0.15;

        (Math.random()-.5)*.12, .12+Math.random()*.10, (Math.random()-.5)*.12, .5, 1.5, 0xd9962e, .5);
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,CT+.12,.16,16,0xe0a63c,.7,.4,1.7,2.2); }
  },
  knead(sc,p,t,b){ doKnead(sc,p,t,b); },
  boil(sc,p,t,b){  doPot(sc,p,t,b,'boil'); },
  simmer(sc,p,t,b){ doPot(sc,p,t,b,'simmer'); },

  },
  oil(sc,p,t,b){
    const pour = sstep(b-.32,b-.02,p);
    sc.n.bottleG.pos=[.42+(1-pour)*.1, 1.18-pour*.12, .20];
    sc.n.bottleG.rot[2]= -pour*1.35;
    placeFoods(sc,'none');
    if(pour>.35&&Math.random()<.9) sc.emit(.30,1.16,.06,(Math.random()-.5)*.1,-.5-Math.random()*.3,(Math.random()-.5)*.1,.35,1.6,0xf0cf7a,2.6);
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.14,0,20,0xf5d98a,1.0,.55,2,1.6); }

    sc.n.armR.rot[0]=-.8-pour*.4; sc.n.armL.rot[0]=-.3;
  },
  aroma(sc,p,t,b){
    const k=gauss(p,b,0.14);
    placeFoods(sc,'pan',(i,nd,bs)=>{ bs[1]=bs[1]+Math.sin(t*6+i)*.01+k*.10; });
    sc.n.spatulaG.pos=[.02+k*.1,1.22,.02]; sc.n.spatulaG.rot[2]=.35-Math.sin(t*6)*.3;
    steamPuff(sc,1.0,0,1.2+k*.1,0,.34,0xffe0a0,.6);
    sparks(sc,.5,0,1.14,0,1.0,0xffc45a);
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,1.26,0,22,0xffd98a,1.2,.6,2,0.4); }
    sc.n.armR.rot[0]=-.7-k*.3; sc.n.armL.rot[0]=-.3;
  },
  stirfry(sc,p,t,b){ doStir(sc,p,t,b,'stirfry'); },

  season(sc,p,t,b){
    const tilt=sstep(b-.35,b-.05,p);
    sc.n.shakerG.pos=[-.40+tilt*.12,1.26,.14]; sc.n.shakerG.rot[2]=tilt*1.5;
    placeFoods(sc,'pan',(i,nd,bs)=>{ bs[1]=bs[1]+Math.sin(t*3+i)*.006; });
    if(p>b-.3&&p<b+.1&&Math.random())
      for(let i=0;i<3;i++) sc.emit(-.26,1.24,.12,(Math.random()-.5)*.2,-.4,-.05+Math.random()*.1,.5,1.6,i%2?0xf2ece0:0x8a5a2a,2.4);

  seal(sc,p,t,b){    doSeal(sc,p,t,b); },
  layer(sc,p,t,b){   doLayer(sc,p,t,b); },
  /* 摆盘：点缀不是六根一样的绿条。
     国宴菜走"围边"——沿盘沿摆成一圈并多放几件；家常菜是随手撒在菜上。 */
  garnish(sc,p,t,b){
    /* 已经判过这一拍了 → 保持"成绩摆法"，不要再逐帧覆盖 */
    if(sc._platingG) return;
    const k=sstep(b-.35,b+.05,p);
    const master = !!Sc._plateMaster;
    /* 不再重排：装盘那一步已经按成品造型摆好了，这里只加点缀 */
    const N = master ? 10 : 6;
    for(let i=0;i<10;i++){
      const nd=sc.n['garn'+i];
      if(i>=N){ nd.vis=false; continue; }
      if(i<Math.floor(k*N+0.01)){
        nd.vis=true;
        const e=Math.max(0,Math.min(1,(k-i*(0.9/N))*1.6));
        if(master){
          /* 围边：沿盘沿均布，微微立起，像摆了一圈花草 */
          const a=i/N*Math.PI*2 - Math.PI/2;
          nd.pos=[sc.org[0]+Math.cos(a)*.215, CT+.30-e*.24, sc.org[2]+Math.sin(a)*.155];
          nd.rot=[0, -a, 0.35];
          nd.scale=[.85,.85,.85];
        } else {
          nd.pos=[sc.org[0]+(i-2.5)*.07, CT+.30-e*.24, sc.org[2]+(i%2)*.05];
          nd.rot=[0,i*.9,0]; nd.scale=[1,1,1];
        }
      } else nd.vis=false;
    }
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,CT+.12,0,master?20:14,0x6fd45a,.6,.5,1.8,2.2); }
    sc.n.armR.rot[0]=-1.0; sc.n.armL.rot[0]=-.3;
  },
  /* ---- 装盒：菜从盘里倒进饭盒，盖子扣上 ---- */
  box(sc,p,t,b){
    const P=STATION.plating.org;
    /* foods 挂在根节点下，pos 用世界坐标（= 工位局部 + org）；
       盘里的菜起点 = P + foodBase，落点 = 饭盒内（世界）。 */
    const BX=[P[0]+0.32, CT+0.075, P[2]-0.10];
    const k=sstep(b-.40, b+.04, p);
    /* 起点 = 装盘那一步摆好的成品造型（不再重排成一圈），
       落点 = 饭盒内的分格，也按同一套造型缩到盒里 */
    const pfn = PLATE_BY_ING[Sc._shapeCat||'root'] || PLATE_BY_ING.root;
    for(let i=0;i<7;i++){
      const nd=sc.foods[i];
      const tgt=pfn(i,nd,P,1);
      const e=Math.max(0,Math.min(1,(k-i*0.05)*1.6));
      const arc=Math.sin(e*Math.PI)*0.20;
      nd.vis=true;
      const rel=[tgt[0]-P[0], tgt[2]-P[2]];
      nd.pos[0]=tgt[0]*(1-e) + (BX[0]+rel[0]*0.52)*e;
      nd.pos[1]=tgt[1]*(1-e) + BX[1]*e + arc;
      nd.pos[2]=tgt[2]*(1-e) + (BX[2]+rel[1]*0.52)*e;
      nd.rot[1]=i*.6; nd.rot[0]=e*1.4;
      nd.scale=[1-e*.25, 1-e*.25, 1-e*.25];
    }
    for(let i=0;i<10;i++) sc.n['garn'+i].vis=false;
    // 盖子：抬起 → 悬停 → 扣下
    const lid=sc.n.boxLid;
    const lift=sstep(0, b-.42, p);
    const shut=sstep(b-.16, b+.06, p);
    lid.pos[1]=0.115 + lift*0.30 - shut*0.30;
    lid.rot[2]= lift*0.35 - shut*0.35;
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(.32,CT+.16,-.10,14,0xffe6b0,.7,.5,1.8,2.0);
      Sc.burst(.32,CT+.14,-.10,8,0xd8e4e8,.6,.6,1.6,1.2,'spark'); }
    steamPuff(sc,.25,.32,CT+.14,-.10,.16,0xffffff,.4);
    sc.n.armR.rot[0]=-.85; sc.n.armL.rot[0]=-.6;
  },
  /* ---- 装袋：饭盒整只滑进纸袋，提手绷直 ---- */
  bag(sc,p,t,b){
    const P=STATION.plating.org;
    const BX=[P[0]+0.32, CT+0.01, P[2]-0.10];
    const BG=[P[0]+0.32, CT+0.01, P[2]+0.14];
    const k=sstep(b-.38, b+.02, p);
    sc.n.boxG.pos[0]=(BX[0]-P[0])*(1-k) + (BG[0]-P[0])*k;
    sc.n.boxG.pos[1]=CT+0.01 + Math.sin(k*Math.PI)*0.14 - k*0.02;
    sc.n.boxG.pos[2]=(BX[2]-P[2])*(1-k) + (BG[2]-P[2])*k;
    sc.n.boxG.rot[2]=k*0.20;
    placeFoods(sc,'none');                      // 菜已经封在盒里
    for(let i=0;i<10;i++) sc.n['garn'+i].vis=false;
    sc.n.boxG.vis = k < 0.88;                   // 完全滑进去后被袋子挡住
    const tug=sstep(b-.10, b+.10, p);           // 提手被拎起：袋子微微上提
    sc.n.bagG.pos=[.46, CT+.01 + tug*0.05, .24];
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(.46,CT+.30,.24,12,0xd8b98a,.6,.6,2.0,1.4,'spark'); }
    sc.n.armR.rot[0]=-1.0-tug*.2; sc.n.armL.rot[0]=-.5;
  },
  /* ---- 放门口：把纸袋端到门口矮台，稳稳放下 ---- */
  drop(sc,p,t,b){
    const D=STATION.door.org, PLO=STATION.plating.org;   // bagG 挂在装盘台下，坐标要换算
    const k=sstep(b-.42, b+.02, p);
    sc.n.bagG.vis=true; sc.n.boxG.vis=false;
    const from=[D[0]-PLO[0], 0.90, D[2]-0.42-PLO[2]];    // 端在手里（腰上一点）
    const to  =[D[0]-PLO[0], 0.60, D[2]-PLO[2]];         // 落到矮台面（台顶 .425 + 半高 .17）
    const arc=Math.sin(k*Math.PI)*0.14;
    sc.n.bagG.pos=[from[0]+(to[0]-from[0])*k, from[1]+(to[1]-from[1])*k + arc, from[2]+(to[2]-from[2])*k];
    sc.n.bagG.rot[1]= (1-k)*0.45;
    sc.n.bagG.rot[2]= Math.sin(k*Math.PI)*0.10;
    placeFoods(sc,'none');
    for(let i=0;i<6;i++) sc.n['garn'+i].vis=false;
    if(p>=b&&!sc._f){ sc._f=1; Sc.burst(0,0.62,0,14,0xd8b98a,.6,.5,1.8,1.6,'spark');
      Sc.burst(0,0.60,0,8,0xffe066,.5,.7,1.6,1.0,'star'); }
    sc.n.armR.rot[0]=-.7-k*.25; sc.n.armL.rot[0]=-.7-k*.25;
  },
  /* ---- 成品：盒装（亲友邻里） ---- */
  boxed(sc,p,t,b){
    const P=STATION.plating.org;
    sc.n.boxG.pos=[.32, CT+.01, -.10]; sc.n.boxG.rot=[0,0,0];
    sc.n.boxLid.pos=[0,.115,0]; sc.n.boxLid.rot=[0,0,0];
    placeFoods(sc,'none');
    for(let i=0;i<6;i++) sc.n['garn'+i].vis=false;
    if(sc.grade==='perfect'){
      if(Math.random()<.6) sc.emit(.32+(Math.random()-.5)*.3, CT+.18, -.10+(Math.random()-.5)*.2,
        (Math.random()-.5)*.2, .3+Math.random()*.3, (Math.random()-.5)*.2, 1.2, 2.2, 0xffe066, .2, 'star');
    }
    steamPuff(sc,.22,.32,CT+.14,-.10,.14,0xffffff,.35);
    sc.n.armR.rot[0]=-.4; sc.n.armL.rot[0]=-.4;
  },
  /* ---- 成品：袋装已放门口（顾客） ---- */
  bagged(sc,p,t,b){
    /* 袋子立在装盘台上等你来拎（顾客单要自己拿车钥匙送） */
    sc.n.bagG.vis=true; sc.n.boxG.vis=false;
    sc.n.bagG.pos=[0.32, CT+0.01, 0.14]; sc.n.bagG.rot=[0,0,0];
    placeFoods(sc,'none');
    for(let i=0;i<6;i++) sc.n['garn'+i].vis=false;
    if(sc.grade==='perfect'){
      if(Math.random()<.6) sc.emit(0.32+(Math.random()-.5)*.3, CT+.42, 0.14+(Math.random()-.5)*.2,
        (Math.random()-.5)*.2, .3+Math.random()*.3, (Math.random()-.5)*.2, 1.2, 2.2, 0xffe066, .2, 'star');
    }
    steamPuff(sc,.18,0.32,CT+.34,0.14,.12,0xffffff,.3);
    sc.n.armR.rot[0]=-.4; sc.n.armL.rot[0]=-.4;
  },
  /* 端菜上桌：盘子从手里（相机前下方）划一道弧线落到餐桌空位上 */
  serving(sc,p,t,b){
    const sg = sc.n.serveG; if(!sg) return;
    const k = Math.max(0, Math.min(1, p));
    const TDP=[[-0.45,-0.34],[-0.15,-0.34],[0.15,-0.34],[0.45,-0.34]];
    const TB=[4.25,0,-0.15], s=sc._serveSlot||0;
    const end=[TB[0]+TDP[s][0], 0.80, TB[2]+TDP[s][1]];
    /* 起点：站在餐桌前、端在身前（用工位常量算，不取实时相机 ——
       相机还在缓动时取实时值会让起点跟着抖）。 */
    const SD=STATION.dining, O=SD.org;
    const ex=O[0]+SD.eye[0], ey=SD.eye[1], ez=O[2]+SD.eye[2];
    let fx=(O[0]+SD.look[0])-ex, fy=(SD.look[1])-ey, fz=(O[2]+SD.look[2])-ez;
    const fl=Math.hypot(fx,fy,fz)||1; fx/=fl; fy/=fl; fz/=fl;
    const st=[ex+fx*0.52, ey-0.30, ez+fz*0.52];
    const arc=Math.sin(k*Math.PI)*0.09;
    sg.vis = (k > 0.002 && k < 0.998);
    sg.pos=[st[0]+(end[0]-st[0])*k, st[1]+(end[1]-st[1])*k+arc, st[2]+(end[2]-st[2])*k];
    sg.rot=[0, 0, (1-k)*0.14];
    const q=1+(1-k)*0.05; sg.scale=[q,q,q];
    sc.n.armR.rot[0]=-.7; sc.n.armL.rot[0]=-.7;
  },
  served(sc){},          /* 上桌播完后的收尾态：什么都不做，等玩家坐下尝 */
  plated(sc,p,t,b){
    placeFoods(sc,'plate',(i,nd,bs)=>{ bs[1]=bs[1]+Math.sin(t*1.5+i)*.004; });
    for(let i=0;i<6;i++){ sc.n['garn'+i].vis=true;
      sc.n['garn'+i].pos=[sc.org[0]+(i-2.5)*.07, CT+.06+(i%2)*.02, sc.org[2]+(i%2)*.05]; sc.n['garn'+i].rot[1]=i*.9; }
    if(sc.grade==='perfect'){
      if(Math.random()<.7) sc.emit((Math.random()-.5)*.5, CT+.08, (Math.random()-.5)*.3,
        (Math.random()-.5)*.2, .3+Math.random()*.3, (Math.random()-.5)*.2, 1.2, 2.2, 0xffe066, .2, 'star');
      steamPuff(sc,.2,0,CT+.1,0,.2,0xfff0c0,.3);
    } else if(sc.grade==='fail'){
      steamPuff(sc,.5,0,CT+.1,0,.2,0x4a4048,.35);
    } else steamPuff(sc,.3,0,CT+.1,0,.24,0xffffff,.4);
    sc.n.armR.rot[0]=-.4; sc.n.armL.rot[0]=-.4;
  }
};

/* ===================== 舞台控制器 ===================== */
const Stage = {
  cv:null, ready:false, raf:0,
  perf:{acc:0,n:0,level:0},
  fit(){
    const cv = byId('stage');
    if(!cv) return false;
    if(this.cv!==cv){ this.cv=cv; T3.init(cv); if(!Sc.root) Sc.build(); this.ready=true; }
    else T3.resize();
    return true;
  },
  mount(step, dish, grade){
    if(!this.fit()) return;
    Sc.step = step; Sc.dish = dish||Sc.dish; Sc.grade = grade||null;
    Sc.beat = STEPS[step] ? STEPS[step].beat : 0.5;
    Sc.parts.length = 0; Sc._f = false; Sc._kindleLit = null;
    Sc.shake = 0; Sc.flash = null;
    Sc.focus = STEP_FOCUS[step] || null;
    FP.yaw = FP.tYaw = 0; FP.pitch = FP.tPitch = 0;   // 每步回到正前方
    const st = SETUP[step] || SETUP.idle;
    const at = st.at || 'stove';
    Sc.at = at;
    const SDef = STATION[at];
    Sc.org = SDef.org.slice();
    // 离开炉灶就关火（厨师走开了）
    if(at!=='stove' && at!=='steamer'){ Sc.fireLevel = 0; }
    refreshEye();   // 竖屏后撤与坐姿都在这里统一算
    standAtStation();   // 站着开工：回到这个工位的站位
    // 第一人称：不画厨师自己，也不画手
    if(Sc.n.chef) Sc.n.chef.vis = false;
    if(Sc.n.shadowChef) Sc.n.shadowChef.vis = false;
    hideExtras(Sc);
    for(const g of (st.on||[])) if(Sc.n[g]) Sc.n[g].vis = true;
    if(Sc.n.shadowPan) Sc.n.shadowPan.vis = (at==='stove'||at==='steamer');
    if(Sc.n.shadowPlate) Sc.n.shadowPlate.vis = (at==='plating');
    if(dish){
      /* 成品配色：主料占大头，配料点缀 —— 不再 i%3 机械循环 */
      Sc.applyDishPalette(dish);
      Sc.applyFoodTone();
      Sc.useIngredient(Sc.primaryIng(dish));
      Sc.setPlateTier(!!dish.master);
    }
    for(let i=0;i<7;i++){ Sc.foods[i].scale=[1,1,1]; Sc.foods[i].vis=true; }
    Sc.n.panG.pos=[0,1.0,0]; Sc.n.panG.rot=[0,0,0];
    Sc.n.knifeG.pos=[.16,CT+.16,.22]; Sc.n.knifeG.rot=[0,0,0];
    Sc.n.bottleG.rot=[0,0,0]; Sc.n.shakerG.rot=[0,0,0];
    Sc.n.drinkG.rot=[0,0,0]; Sc.n.drinkG.pos=[.44,1.18,.20];
    /* 倒饮品那一步：容器换成这味饮品的真造型（瓶/罐/杯），液体色同步 */
    Sc.setDrinkShape(step==='pourDrink' ? dish : null);
    Sc.n.ovenDoorP.rot=[0,0,0]; Sc.n.fridgeDoorP.rot=[0,0,0];
    // 注视点对准这一步要操作的物件
    const f = Sc.focus;
    if(f && Sc.n[f] && INTER[f]){
      const w = worldOf(Sc.n[f]);
      const lk = INTER[f].lk||[0,0,0];
      Sc.lookWant = [w[0]+lk[0], w[1]+lk[1], w[2]+lk[2]];
    }
    this.start();
  },
  /* 准心射线拾取：从眼睛沿视线找最近的可交互物件 */
  pick(){
    const o = T3.camPos, t = T3.camTgt;
    let dx=t[0]-o[0], dy=t[1]-o[1], dz=t[2]-o[2];
    const dl = Math.hypot(dx,dy,dz)||1; dx/=dl; dy/=dl; dz/=dl;
    let best=null, bestT=1e9, foc=null, focT=1e9, pri=null, priT=1e9;
    for(const k in INTER){
      const nd = Sc.n[k];
      if(!nd || nd.vis===false) continue;
      const w = worldOf(nd);
      /* 判定球心 = 节点原点 + lk（和"注视点"用的是同一个点）。
         不加 lk 的话，桌椅盆栽这类原点在地面的家具，判定球会埋在地板里。 */
      const lkO = INTER[k].lk || [0,0,0];
      const ox=w[0]+lkO[0]-o[0], oy=w[1]+lkO[1]-o[1], oz=w[2]+lkO[2]-o[2];
      const tca = ox*dx+oy*dy+oz*dz;
      if(tca <= 0.05) continue;
      const r = INTER[k].r;
      const d2 = ox*ox+oy*oy+oz*oz - tca*tca;
      if(d2 > r*r) continue;
      const th = Math.sqrt(r*r-d2);
      const tt = tca - th;
      if(tt < 0.05) tt = 0.05;
      /* pd = 准心射线到球心的真实垂距（越小说明瞄得越准）；
         别用 sqrt(r*r-d2)，那是弦长的一半，正中心反而最大。 */
      const pd = Math.sqrt(d2>0?d2:0);
      const it = {k:k, nd:nd, d:tt, pd:pd, label:INTER[k].label, act:INTER[k].act||null};
      if(tt < bestT){ bestT=tt; best=it; }
      /* 小物件（桌上的菜）被大判定球（餐桌）包住时优先选小的，否则永远选不到 */
      if(INTER[k].pri && pd < priT){ priT=pd; pri=it; }
      // 当前步骤的目标物件优先（哪怕有工具挡在前面）
      if(k === Sc.focus && tt < focT){ focT=tt; foc=it; }
    }
    if(foc && (!best || focT <= bestT + 0.40)) return foc;
    /* 小物件优先：准心确实正对着它（垂距很小）就选它，
       否则大判定球（餐桌 r=.62）的入射点总是更早，小盘子永远选不中。 */
    if(pri && pri.pd < 0.15) return pri;
    return best;
  },
  start(){ if(this.raf) return; const f=()=>{ this.frame(); this.raf=requestAnimationFrame(f); }; this.raf=requestAnimationFrame(f); },
  stop(){ if(this.raf) cancelAnimationFrame(this.raf); this.raf=0; },
  /* 自适应画质：全屏后像素预算是主要约束，所以降级要同时压 SS 和 maxP，
     帧时间宽裕时也能自动升回去（高端机拿到更清晰的画面）。 */
  autoScale(dt){
    const pf=this.perf;
    pf.acc += dt; pf.n++;
    if(pf.n < 40) return;
    const avg = pf.acc/pf.n; pf.acc=0; pf.n=0;
    const L = [{SS:1.18,maxP:112000},{SS:1.04,maxP:92000},{SS:0.94,maxP:74000},{SS:0.82,maxP:57000}];
    let lv = pf.level;
    if(avg > 0.027 && lv < 3) lv++;
    else if(avg < 0.0135 && lv > 0) lv--;
    if(lv !== pf.level){
      pf.level = lv; T3.SS = L[lv].SS; T3.maxP = L[lv].maxP; T3.resize();
    }
  },
  frame(){
    if(!this.fit()) return;
    if(!this.ready) return;
    const now = performance.now();
    const dt = Math.min(.05, Math.max(0,(now-Sc.lp)/1000)); Sc.lp = now;
    Sc.tt = (now - Sc.t0)/1000;
    this.autoScale(dt);
    // 相机：第一人称，眼睛平滑移到工位，注视点平滑跟随
    // 瞄准阶段（还没开始这一步）让注视点贴住目标物件，准心才真对准它
    /* 眼睛 = 自由走动坐标（roam）；注视点 = 沿本工位视线方向前伸 1 米，
       保住每个工位该有的俯角（低头看灶台 / 平视餐桌），再叠加玩家的转头。
       坐下时改到座位坐标并看向桌子或电视。 */
    {
      const bob = Sc.sitting ? 0 : Math.sin(Sc.bob||0)*0.012*Math.min(1,Math.hypot(MOVE.x,MOVE.y));
      const ex = Sc.roam ? Sc.roam[0] : Sc.eyeWant[0];
      const ez = Sc.roam ? Sc.roam[1] : Sc.eyeWant[2];
      const ey = (Sc.eyeY||1.58) + bob;
      Sc.eyeWant = [ex, ey, ez];
      if(Sc.sitting && Sc._seatLook){
        Sc.lookWant = Sc._seatLook.slice();
      }else{
        const D0 = Sc.lookDir || [0,-0.30,-0.95];
        Sc.lookWant = [ex+D0[0], ey+D0[1], ez+D0[2]];
      }
    }
    {
      const ss = S.session;
      const aiming = (!ss || ss.phase!=='cook' || ss.stage==='aim');
      if(aiming && Sc.focus && Sc.n[Sc.focus] && Sc.n[Sc.focus].vis !== false){
        const w = worldOf(Sc.n[Sc.focus]), lk = INTER[Sc.focus].lk || [0,0,0];
        Sc.lookWant = [w[0]+lk[0], w[1]+lk[1], w[2]+lk[2]];
      }
    }
    const kl = Sc.instaCam ? 1 : Math.min(1, dt*8);
    for(let i=0;i<3;i++){
      Sc.eyeNow[i] += (Sc.eyeWant[i]-Sc.eyeNow[i])*kl;
      Sc.lookNow[i] += (Sc.lookWant[i]-Sc.lookNow[i])*kl;
    }
    // 玩家自由环视
    /* 角差取 [-π,π] 的等价角：tYaw 可以无限增长，但跟随永远走最短的一边，
       不会出现"转过 180° 就整圈甩回去"。 */
    let dyaw = FP.tYaw - FP.yaw;
    dyaw -= Math.round(dyaw/(Math.PI*2))*Math.PI*2;
    FP.yaw += dyaw*Math.min(1, dt*11);
    FP.tPitch = clamp(FP.tPitch, FP_LIM.pitDn, FP_LIM.pitUp);   // 兜底：任何路径都别把俯仰推出限
    FP.pitch += (FP.tPitch-FP.pitch)*Math.min(1, dt*11);
    /* 数值回绕：转了很多圈之后把两者一起减掉整圈，避免浮点越来越大 */
    if(FP.tYaw > Math.PI*4 || FP.tYaw < -Math.PI*4){
      const w = Math.round(FP.tYaw/(Math.PI*2))*Math.PI*2;
      FP.tYaw -= w; FP.yaw -= w;
    }
    let bx=Sc.lookNow[0]-Sc.eyeNow[0], by=Sc.lookNow[1]-Sc.eyeNow[1], bz=Sc.lookNow[2]-Sc.eyeNow[2];
    const bl=Math.hypot(bx,by,bz)||1; bx/=bl; by/=bl; bz/=bl;
    const yaw0=Math.atan2(bx,bz), pit0=Math.asin(Math.max(-1,Math.min(1,by)));
    const yaw=yaw0+FP.yaw, pit=Math.max(-1.25, Math.min(0.85, pit0+FP.pitch));
    const cp=Math.cos(pit);
    Sc.camNow = [Sc.eyeNow[0], Sc.eyeNow[1], Sc.eyeNow[2]];
    Sc.tgtNow = [Sc.eyeNow[0]+Math.sin(yaw)*cp, Sc.eyeNow[1]+Math.sin(pit), Sc.eyeNow[2]+Math.cos(yaw)*cp];
    // 水平前向量（供摇杆用）：下一帧按它把"屏幕前后左右"投到世界 XZ
    Sc.fwd = [Math.sin(yaw), Math.cos(yaw)];
    // 灶火
    let targetVis = Sc.fireLevel>0 ? 1 : 0;
    if(Sc.step==='kindle' && Sc._kindleLit!==null) targetVis = Sc._kindleLit;
    Sc.flameVis += (targetVis - Sc.flameVis) * Math.min(1, dt*9);
    const fl = 0.85 + 0.15*Math.sin(now/70) + 0.08*Math.sin(now/31);
    const lvlK = Sc.fireLevel>0 ? (0.42 + Sc.fireLevel*0.26) : 0.42;
    const fS = Sc.flameVis * lvlK * fl;
    for(let i=0;i<5;i++){
      const o = 0.82 + 0.22*Math.sin(now/58 + i*1.9);
      Sc.n['flame'+i].scale=[fS*o, fS*o*(0.85+0.35*Math.sin(now/47+i*1.3)), fS*o];
    }
    Sc.n.flameCore.vis = Sc.flameVis>0.5 && Sc.fireLevel>=2;
    Sc.n.flameCore.scale=[fS, fS*(0.9+0.3*Math.sin(now/40)), fS];
    Sc.n.flame.vis = Sc.flameVis > 0.03;
    if(Sc.step!=='hotpot'){
      Sc.n.glow.vis = Sc.flameVis>0.5 && Sc.fireLevel>=2;
      const gs = 0.6+Sc.fireLevel*0.16;
      Sc.n.glow.scale=[gs,1,gs];
    }
    // 局部光源：灶火 / 烤箱灯 / 冰箱灯 / 吊灯，工位不同光色不同
    const onStove = (Sc.at==='stove'||Sc.at==='steamer');
    let lp, li, lc;
    if(Sc.at==='oven'){
      lp=[Sc.org[0],1.02,Sc.org[2]+0.40];
      const op = (Sc.step==='bake') ? Math.max(0, Math.min(1,(window.__phase!==undefined?window.__phase:0)/0.6)) : 0.2;
      li = 0.45+0.45*op; lc=[1.0,0.44,0.14];
    } else if(Sc.at==='fridge'){
      lp=[Sc.org[0],0.95,Sc.org[2]+0.62];
      li = Sc.step==='chill' ? 0.62 : 0.30; lc=[0.50,0.78,1.00];
    } else if(onStove){
      lp=[Sc.org[0],1.05,Sc.org[2]];
      li=Sc.flameVis*(Sc.fireLevel||0)*0.55; lc=[1.0,0.52,0.18];
    } else {
      lp=[Sc.org[0],1.62,Sc.org[2]-0.30];
      li=0.34; lc=[1.0,0.84,0.60];   // 头顶吊灯
    }
    T3.fireI = li; T3.firePos = lp; T3.fireCol = lc;
    T3.flick = onStove ? fl : 1;
    Sc.ambientTick(dt, now);   // 电视 / 收音机 / 水槽 / 绿植（frame 是 Stage 的方法）
    // 相机
    if(Sc.shake>0) Sc.shake=Math.max(0,Sc.shake-dt*2.6);
    const sx = Sc.shake>0 ? (Math.random()-.5)*0.09*Sc.shake : 0;
    const sy = Sc.shake>0 ? (Math.random()-.5)*0.07*Sc.shake : 0;
    this.roamStep(dt);
    T3.camPos = [Sc.camNow[0]+sx, Sc.camNow[1]+sy, Sc.camNow[2]];
    T3.camTgt = Sc.tgtNow;
    T3.lookAt(); T3.clear();
    Sc.hover = this.pick();
    /* 打包好了等你送：车钥匙亮一圈金光并微微脉动 */
    const awaiting = !!(S.session && S.session.awaitKey);
    if(Sc.n.ckGlow){
      Sc.n.ckGlow.vis = awaiting;
      if(awaiting){
        const q = 1 + Math.sin(performance.now()*0.006)*0.22;
        Sc.n.ckGlow.scale = [q,q,q];
      }
    }
    this.serveStep(dt); this.eatStep(dt); sipStep(dt);
    /* 端菜上桌是自由播放的（不走节奏条），单独喂进度 */
    const p = (Sc._serve !== null && Sc._serve !== undefined) ? Sc._serve
      : (Sc.step==='plated'||Sc.step==='idle'||Sc.step==='served') ? 0
      : (window.__phase!==undefined ? window.__phase : 0);
    const fn = ANIM[Sc.step] || ANIM.idle;
    try{ fn(Sc, p, Sc.tt, Sc.beat); }catch(e){}
    Sc.instaCam = false;
    T3.drawScene(Sc.root);
    T3.present();
    this.drawParts(dt);
    this.drawFlash(dt);
    this.updateCross();
  },
  /* ===================== 端菜上桌 ===================== */
  serveToTable(slot, dishId, grade, heat, dark){
    const d = dishOf(dishId);
    Sc._serveSlot = slot;
    Sc._serveDish = {dish:dishId, grade:grade||'ok', heat:(heat===undefined?null:heat),
      dark:dark||null, chaos:!!(d&&d.chaos)};
    Sc._serve = 0; Sc._serveDone = false;
    if(Sc.serveMat && d){
      /* 做砸了 → 整盘是焦黑的黑暗料理，不再是菜品本色 */
      const tone = dark ? ['#2e2620','#4a3a2a','#1e1a16']
                        : applyHeatTone(Sc.dishTone(d), (heat===undefined?null:heat));
      Sc.serveMat.c     = parseInt(tone[0].slice(1),16);
      Sc.serveMat2.c    = parseInt(tone[1].slice(1),16);
      Sc.serveSauceMat.c= parseInt(tone[2].slice(1),16);
      const vs = Sc.n.serveG && Sc.n.serveG['_vessel_sgV'];
      if(vs) vs.set(vesselOf(d));
    }
    this.mount('serving', d);
  },
  serveStep(dt){
    if(Sc._serve===null || Sc._serve===undefined) return;
    Sc._serve += dt/1.05;
    if(Sc._serve >= 1){
      Sc._serve = 1;
      if(!Sc._serveDone){ Sc._serveDone = true; this.finishServing(); }
      /* 播完交给玩家：切到空步骤（进度归零，手里的盘子不会僵在半空），
         镜头留在餐桌前，可以坐下尝。 */
      Sc._serve = null; Sc.step = 'served';
    }
  },
  finishServing(){
    if(Sc.n.serveG) Sc.n.serveG.vis = false;
    const it = Sc._serveDish; if(!it) return;
    const TDP=[[-0.45,-0.34],[-0.15,-0.34],[0.15,-0.34],[0.45,-0.34]];
    const s = Sc._serveSlot||0;
    if(Sc.n['td'+s]) Sc.n['td'+s].vis = true;      // 先摆上去，再入档
    it.heat = (it.heat===undefined) ? null : it.heat;
    it.dark = it.dark || null;
    it.chaos = !!it.chaos;
    it.slot = s; S.table.push(it);
    syncTableDishes(); save();
    const d = dishOf(it.dish);
    beep(720,.08,'sine',.05); setTimeout(()=>beep(540,.10,'sine',.04),90);
    toast('🍽️ '+d.e+d.n+' 端上餐桌了 · 坐下尝一口');
    Sc._serveDish = null;
  },
  /* ===================== 坐下吃：一口一口把盘里的菜吃掉 ===================== */
  eatStep(dt){
    const E = Sc._eat; if(!E) return;
    E.t += dt;
    const DUR = 1.30, k = Math.min(1, E.t/DUR), s = E.slot;
    const names = ['tdFa','tdFb','tdFc'];
    for(let j=0;j<3;j++){
      const nd = Sc.n[names[j]+s]; if(!nd) continue;
      const a = j*0.20+0.08, b2 = a+0.30;
      const kk = (k-a)/(b2-a);
      const q = kk<=0 ? 1 : (kk>=1 ? 0 : 1-kk);
      nd.scale=[q,q,q]; nd.vis = q > 0.02;
      // 每吃掉一块冒一点热气
      if(kk>0.05 && kk<0.12 && Math.random()<0.7)
        Sc.emit(TDPX[s][0], 0.84, TDPX[s][1],
          (Math.random()-.5)*.12, .3+Math.random()*.2, (Math.random()-.5)*.12,
          .7, 1.8, 0xffffff, -0.05, 'steam');
    }
    if(k >= 1){
      const t = Sc.n['td'+s]; if(t) t.vis = false;
      for(let j=0;j<3;j++){ const nd=Sc.n[names[j]+s]; if(nd){ nd.scale=[1,1,1]; nd.vis=true; } }
      Sc._eat = null;
      E.after();                 // 吃完才结算：扣掉这份、给心得、弹结论
    }
  },
  /* 走动：只由摇杆驱动，不再"转头到极限就自动走过去" */
  roamStep(dt){
    const sess = S.session;
    const cooking = !!(sess && sess.phase==='cook');
    if(cooking) return;                            // 做菜时钉在工位上
    const f = Sc.fwd || [0,-1];
    const fx = f[0], fz = f[1];
    const rx = -fz, rz = fx;                     // 右手边 = 前向量转 -90°
    let mx = fx*MOVE.y + rx*MOVE.x;
    let mz = fz*MOVE.y + rz*MOVE.x;
    const mag = Math.hypot(mx,mz);
    if(mag < 0.02){ return; }
    if(Sc.sitting){ toggleSit(Sc.seat); return; } // 一推摇杆就起身，再推才走
    mx = mx/mag*MOVE.spd*Math.min(1,mag)*dt;
    mz = mz/mag*MOVE.spd*Math.min(1,mag)*dt;
    // 分轴推进：撞到家具时还能沿墙滑，不会整个卡死
    const nx = Sc.roam[0]+mx, nz = Sc.roam[1]+mz;
    if(!blockedAt(nx, Sc.roam[1])) Sc.roam[0] = nx;
    if(!blockedAt(Sc.roam[0], nz)) Sc.roam[1] = nz;
    // 走动时轻微起伏，像真的在迈步
    Sc.bob = (Sc.bob||0) + dt*9.5;
  },
  walkTo(st){
    const D = STATION[st];
    Sc.at = st;
    refreshEye(); standAtStation();
    FP.yaw = 0; FP.tYaw = 0; FP.pitch = 0; FP.tPitch = 0;
    Sc._walkCd = 1.0;
    beep(360,.06,'sine',.035);
    toast('🚶 '+D.e+D.n);
  },

  /* 准心：常态小点 → 盯上物件变空心圈 → 交互时填满 → 再回到空心 */
  updateCross(){
    const sess = S.session;
    const canAim = (!sess || sess.phase!=='cook' || sess.stage==='aim');
    const dx=Sc.eyeNow[0]-Sc.eyeWant[0], dy=Sc.eyeNow[1]-Sc.eyeWant[1], dz=Sc.eyeNow[2]-Sc.eyeWant[2];
    const lx=Sc.lookNow[0]-Sc.lookWant[0], ly=Sc.lookNow[1]-Sc.lookWant[1], lz=Sc.lookNow[2]-Sc.lookWant[2];
    const settled = (dx*dx+dy*dy+dz*dz) < 0.0016 && (lx*lx+ly*ly+lz*lz) < 0.0016;
    const hot = Sc.hover && canAim && !bar.on && settled;
    const isTarget = hot && Sc.hover.k === Sc.focus;
    const c = byId('cross'), lb = byId('clabel');
    if(c){
      const cls = 'cross' + (hot?' hot':'') + (hot&&!isTarget?' alt':'') + (FP.fill?' fill':'')
        + (bar.on?' hide':'');
      if(c.className !== cls) c.className = cls;
    }
    if(lb){
      const txt = (hot && !bar.on) ? Sc.hover.label : '';
      if(lb.textContent !== txt) lb.textContent = txt;
      const on = !!hot;
      if(lb.classList.contains('on') !== on) lb.classList.toggle('on', on);
    }
    // 交互按键：和准心同一套状态（对准 → 高亮 + 显示物件名）
    const pad = byId('actpad'), ab = byId('actBtn'), al = byId('actLab');
    if(pad){
      const inScene = (S.tab==='kitchen');   // 抽屉打开时（含说明页）收起这些浮层
      const cooking = !!(S.session && S.session.phase==='cook');
      const show = inScene;
      const d = show ? '' : 'none';
      if(pad.style.display !== d) pad.style.display = d;
      const jp = byId('joypad');
      if(jp){
        const jd = (inScene && !cooking) ? '' : 'none';   // 做菜时钉在工位上
        if(jp.style.display !== jd) jp.style.display = jd;
      }
    }
    if(al){
      const sess2 = S.session;
      const aiming = sess2 && sess2.phase==='cook' && sess2.stage==='aim';
      const running = bar.on && bar.phase !== 'prep';
      let txt = '交互';
      if(running) txt = sess2 && sess2.isKindle ? '点火' : '出手';
      else if(sess2 && sess2.awaitKey && hot && Sc.hover.k==='carKey') txt = '🛵 送出外卖';
      else if(sess2 && sess2.awaitKey) txt = '🚗 找车钥匙';   // 折叠着找钥匙：一路给指引
      else if(hot) txt = (aiming && Sc.hover.k===Sc.focus ? '开始 · ' : '') + Sc.hover.label;
      else if(aiming && Sc.focus) txt = (INTER[Sc.focus] ? INTER[Sc.focus].label : '目标');
      if(al.textContent !== txt) al.textContent = txt;
      const ic = ab ? ab.querySelector('.ico') : null;
      const em = running ? '👊' : (hot ? (isTarget ? '👊' : '👆') : '👆');
      if(ic && ic.textContent !== em) ic.textContent = em;
      if(ab){
        const c2 = 'actbtn' + (running ? ' on' : (hot?' on':'')) + (FP.fill?' busy':'');
        if(ab.className !== c2) ab.className = c2;
      }
    }
  },
  drawParts(dt){
    const P=Sc.parts, ctx=T3.ctx, SC=T3.SC;
    if(!ctx) return;
    for(let i=P.length-1;i>=0;i--){
      const q=P[i];
      q.l -= dt; if(q.l<=0){ P.splice(i,1); continue; }
      q.vy -= q.g*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt;
      const s=T3.proj(q.x,q.y,q.z); if(!s) continue;
      const a=Math.max(0,Math.min(1,q.l/q.m));
      const x=s.x*SC, y=s.y*SC;
      const r = (q.t==='steam' ? q.s*(2.2-a*0.9) : q.s*1.35)*SC;
      ctx.globalAlpha = q.t==='steam' ? a*0.30 : a;
      ctx.fillStyle = '#'+('000000'+(q.c&0xffffff).toString(16)).slice(-6);
      if(q.t==='star'){
        ctx.strokeStyle = ctx.fillStyle;
        ctx.lineWidth = Math.max(1, r*0.55); ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(x-r, y); ctx.lineTo(x+r, y);
        ctx.moveTo(x, y-r); ctx.lineTo(x, y+r);
        ctx.stroke();
      } else if(q.t==='spark'){
        // 低多边形碎片：小菱形
        ctx.beginPath();
        ctx.moveTo(x, y-r); ctx.lineTo(x+r*0.7, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r*0.7, y);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(x, y, r*0.5, 0, 6.2832); ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  },
  drawFlash(dt){
    if(!Sc.flash) return;
    Sc.flash.t += dt;
    const a = Math.max(0, 1 - Sc.flash.t/Sc.flash.dur);
    if(a<=0){ Sc.flash=null; return; }
    const ctx=T3.ctx;
    ctx.globalAlpha = a*0.45; ctx.fillStyle = Sc.flash.c;
    ctx.fillRect(0,0,T3.cv.width,T3.cv.height);
    ctx.globalAlpha = 1;
  },
  hit(r){
    Sc.shake = r==='miss'?1:0.25;
    const px=Sc.org[0], py=1.2, pz=Sc.org[2];
    if(r==='perfect'){
      Sc.flash={c:'#31d17c',t:0,dur:.45};
      Sc.burst(0,py,0,26,0xffe066,1.6,.9,2.2,.6,'star');
      Sc.burst(0,py,0,14,0x4ce39a,1.2,.7,1.8,1.0,'spark');
    } else if(r==='great'){
      Sc.flash={c:'#ffb02e',t:0,dur:.35};
      Sc.burst(0,py,0,16,0xffc247,1.3,.6,1.8,1.0,'spark');
    } else if(r==='good'){
      Sc.flash={c:'#9fd0ff',t:0,dur:.25};
      Sc.burst(0,py,0,10,0xdae8ff,.8,.6,2,-.1,'steam');
    } else {
      Sc.flash={c:'#ff3b30',t:0,dur:.4};
      Sc.burst(0,py,0,14,0x4a4038,.7,1.0,2.6,-.15,'steam');
    }
  }
};

/* ===================== 节奏判定核心 ===================== */
/* 去掉"碰运气"：
   1) 游标单程匀速推进（不再来回乱跑），全程可预判
   2) 判定点 = 这一步的节拍 beat，画面动作会在同一瞬间到达最高潮 —— 看动画抓时机
   3) 判定点只有极小的确定性偏移（每步固定循环），练熟就能稳定复现
   4) 出手前有"预备"节拍，帮你建立节奏
   5) 按住「凝神」可把时间放慢到 42%，消耗专注值 —— 主动权在你手上 */
const OFF = [-0.025, 0, 0.025];
let bar = {on:false, phase:'prep', pos:0, pt:0, PREP:0.9, T:2.2, target:.5, raf:0, last:0, slow:false, ticked:false};
window.__phase = 0;

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function startStep(){
  const sess = S.session, d = dishOf(sess.dishId);
  let stepId = flowOf(sess)[sess.idx];
  const real = STEPS[stepId];
  // 灶火不是常开的：这一步要用火而火还关着 → 先点一次火
  const needFire = real.fire || 0;
  sess.isKindle = (needFire > 0 && Sc.fireLevel === 0);
  if(sess.isKindle) stepId = 'kindle';
  const st = STEPS[stepId];
  bar.on = false; bar.phase = 'prep'; bar.pt = 0; bar.pos = 0; bar.slow = false; bar.ticked = false;
  bar.T = (1.95 + (st.v-0.8)*1.15 + (d.s-1)*0.07) * masterySpeed(sess.dishId);
  bar.target = st.beat + (sess.isKindle ? 0 : OFF[sess.idx % 3]);
  bar.reqFire = sess.isKindle ? 0 : needFire;
  setSlow(false);
  sess.stage = 'aim';
  Stage.mount(stepId, d);
  renderKitchen();
  syncFire();
  window.__phase = -0.35;
  // 目标物件没出现在场景里（保险）→ 直接进入节奏
  const f = Sc.focus;
  if(!f || !Sc.n[f] || Sc.n[f].vis === false) setTimeout(beginBeat, 80);
}
/* 准心对准目标并点击 → 这一步真正开始 */
function beginBeat(){
  const sess = S.session;
  if(!sess || sess.phase!=='cook' || bar.on) return;
  sess.stage = 'beat';
  bar.on = true; bar.phase = 'prep'; bar.pt = 0; bar.pos = 0; bar.slow = false; bar.ticked = false;
  renderKitchen();
  syncFire();
  window.__phase = -0.35;
  bar.last = performance.now();
  cancelAnimationFrame(bar.raf);
  bar.raf = requestAnimationFrame(tick);
}
/* 准心交互：小点 → 空心圈 → 点击填满 → 回到空心 */
function engage(){
  if(Sc.busy) return;
  const h = Sc.hover;
  if(!h){
    if(S.session && S.session.awaitKey){ toast('🚗 车钥匙在备料台那一头 · 亮着金光'); }
    return;
  }
  Sc.busy = true; FP.fill = 1;
  const c = byId('cross'); if(c) c.classList.add('fill');
  beep(h.act==='fire'?520:700, .07, 'triangle', .05);
  setTimeout(()=>{
    Sc.busy = false; FP.fill = 0;
    const cc = byId('cross'); if(cc) cc.classList.remove('fill');
    afterEngage(h);
  }, 430);
}
/* ===================== 站位：自由走动 + 坐姿 ===================== */
/* 座位表：眼睛高度 = 座面 + 0.76（成年人坐着的眼高），注视点朝向桌子/电视，
   所以是"坐进椅子里"，不是原地蹲下。 */
const SEATS = {
  chairA:{p:[4.25, 0.62], y:1.30, look:[4.25, 0.90, -0.15]},
  chairB:{p:[3.165,-0.15],y:1.30, look:[4.25, 0.90, -0.15]},
  chairC:{p:[5.335,-0.15],y:1.30, look:[4.25, 0.90, -0.15]},
  sofa:  {p:[5.60, 0.85], y:1.39, look:[5.60, 1.34, -0.90]}
};
function refreshEye(){
  const D = STATION[Sc.at] || STATION.stove;
  Sc.org = D.org.slice();                       // 食材/粒子仍按工位局部坐标
  Sc.eyeY = D.eye[1] + (T3.portrait ? 0.04 : 0);
  if(!Sc.roam){
    const zb = T3.portrait ? 1.30 : 1;          // 竖屏站远一点，俯角变小
    Sc.roam = [D.org[0]+D.eye[0], D.org[2]+D.eye[2]*zb];
  }
  updateLookDir();
}
/* 视线方向（单位向量，含俯角）：走动时沿用，所以低头看着灶台的姿势不会丢 */
function updateLookDir(){
  const D = STATION[Sc.at] || STATION.stove;
  const ex=Sc.roam[0], ez=Sc.roam[1], ey=Sc.eyeY;
  let dx=D.org[0]+D.look[0]-ex, dy=D.look[1]-ey, dz=D.org[2]+D.look[2]-ez;
  const L=Math.hypot(dx,dy,dz)||1;
  Sc.lookDir=[dx/L, dy/L, dz/L];
}
/* 站回工位（每一步开始时、或从工位间切换） */
function standAtStation(){
  const D = STATION[Sc.at] || STATION.stove;
  const zb = T3.portrait ? 1.30 : 1;
  Sc.roam = freeSpot(D.org[0]+D.eye[0], D.org[2]+D.eye[2]*zb);
  Sc.seat = null; Sc.sitting = false;
  updateLookDir();
}

const TV_COL = [0x5b86b8, 0x7a5f9e, 0x2f7a63, 0x8a5b3a, 0x38668f, 0x6b4f7a];

function toggleSit(key){
  const sess = S.session;
  if(sess && sess.phase==='cook'){ toast('做菜中，别坐着'); beep(300,.07,'square',.04); return; }
  if(Sc.sitting){
    Sc.sitting = false; Sc.seat = null; Sc._seatLook = null;
    Sc.roam = freeSpot(Sc.roam[0], Sc.roam[1]); // 就在椅子这儿站起来（别卡进家具）
    Sc.eyeY = (Sc._preSit && Sc._preSit.eyeY) || 1.58;
    if(Sc._preSit) Sc.lookDir = Sc._preSit.dir.slice();
    toast('🧍 起身上灶');
    beep(560,.07,'sine',.05); setTimeout(()=>beep(720,.08,'sine',.04),80);
    return;
  }
  const seat = SEATS[key] || SEATS.chairA;
  Sc._preSit = {eyeY:Sc.eyeY, dir:(Sc.lookDir||[0,-0.3,-0.95]).slice()};
  Sc.seat = key; Sc.sitting = true;
  Sc.roam = seat.p.slice();                     // 走过去坐下
  Sc.eyeY = seat.y;

  beep(430,.08,'sine',.05); setTimeout(()=>beep(330,.10,'sine',.04),90);
}

function afterEngage(h){
  const sess = S.session;
  const aiming = sess && sess.phase==='cook' && sess.stage==='aim';
  if(aiming && h.k === Sc.focus){ beginBeat(); return; }
  if(h.act === 'fire'){ actions.fire(((Sc.fireLevel||0)+1) % 4); return; }
  if(h.act === 'phone'){ ringOrder('customer'); return; }   // 电话 → 顾客
  if(h.act === 'paper'){ ringOrder('friend');   return; }   // 订单纸 → 亲友邻里
  if(h.act === 'keys'){                                     // 车钥匙
    const sk = S.session;
    if(sk && sk.awaitKey){ deliverTakeout(); return; }      //   打包好了 → 骑车送出去
    goMarket();                                             //   平时 → 出门采购
    return;
  }               // 车钥匙 → 出门采购
  if(h.act === 'fridge'){ openFridge();         return; }   // 冰箱 → 取食材
  if(h.act === 'drinkcab'){ openDrinkCab();     return; }   // 饮料柜 → 存/取/喝
  if(h.act === 'sit'){ toggleSit(h.k);    return; }   // 椅子 / 沙发 → 坐下
  if(h.act === 'tv'){ toggleTV();         return; }   // 电视 → 开/关
  if(h.act === 'light'){ toggleLights();  return; }   // 电灯开关
  if(h.act === 'radio'){ toggleRadio();   return; }   // 收音机
  if(h.act === 'sink'){ toggleSink();     return; }   // 水槽 → 放水/关水
  if(h.act === 'clock'){ showClock();     return; }   // 挂钟 → 看时间
  if(h.act === 'water'){ waterPlant();    return; }   // 盆栽 → 浇水
  if(h.act === 'taste'){ tasteDish(h.k);  return; }   // 桌上的菜 → 自己尝一口
  if(sess) toast('👀 ' + h.label + ' · 这一步用不上');
}

   买的饮品存进柜子；取出来可以喝。喝的时候第一人称举到眼前。 */
function cabCount(){ let n=0; for(const k in S.cab) n += S.cab[k]; return n; }
/* 柜里的瓶子按种类摆格：三层 × 每层最多 5 瓶 */
function refreshCab(){
  const g = Sc.n && Sc.n.dcBottles; if(!g) return;
  g.children.length = 0;
  const keys = Object.keys(S.cab).filter(k=>S.cab[k]>0);
  if(!keys.length) return;
  let i = 0;
  const shelfY = [.335, .715, 1.095];
  for(const k of keys){
    const n = Math.min(S.cab[k], 5);
    for(let j=0;j<n && i<15;j++){
      const row = Math.min(2, Math.floor(i/5));
      const col = i%5;
      const nd = node(null, [-.36+col*.18, shelfY[row], .02]);
      nd.parent = g; g.children.push(nd);
      Sc.setNodeDrink(nd, k, 1.9);
      const b = nd.children[0];
      if(b) b.pos[1] = (DRINK_SPEC[k].h||.16)*1.9/2;
      i++;
    }
  }
}

function startSip(key){
  if(!key || !DRINK_SPEC[key]) return;
  if(!(S.cab[key]>0)) return;
  closeDrinkCab();
  S.cab[key]--; if(S.cab[key]<=0) delete S.cab[key];
  save(); refreshCab();

  Sc.setNodeDrink(Sc.n.holdG, key, 1.0);
  const g = Sc.n.holdG; g.vis = true;
  beep(620,.06,'sine',.04);
  toast('🥤 喝一口 '+ING[key].n+'…');

/* 每帧把杯子摆到眼前：举起 → 仰头倒 → 放下 */
function sipStep(dt){
  const sp = Sc.sip;
  const g = Sc.n.holdG;
  if(!sp){ if(g) g.vis = false; return; }
  sp.t += dt;
  const u = Math.min(1, sp.t/sp.dur);
  const cam = T3.camPos, tgt = T3.camTgt;
  /* 相机基：前 f、右 r、上 up */
  let fx=tgt[0]-cam[0], fy=tgt[1]-cam[1], fz=tgt[2]-cam[2];
  const fl=Math.hypot(fx,fy,fz)||1; fx/=fl; fy/=fl; fz/=fl;
  let rx=-fz, rz=fx; const rl=Math.hypot(rx,rz)||1; rx/=rl; rz/=rl;
  /* up = r × f */
  let ux=-rz*fy, uy=rz*fx-rx*fz, uz=rx*fy;
  const ul=Math.hypot(ux,uy,uz)||1; ux/=ul; uy/=ul; uz/=ul;
  /* 瓶口到中心的距离（startSip 用 1:1 尺寸摆放，所以就是真实高的一半） */
  const H = (DRINK_SPEC[sp.key]||{h:.16}).h;
  const L = H/2;
  /* "嘴"的位置：相机正前方一点、略低于视线 —— 瓶口要对准这里 */
  const mouth = [cam[0]+fx*0.26+rx*0.015-ux*0.05,
                 cam[1]+fy*0.26        -uy*0.05,
                 cam[2]+fz*0.26+rz*0.015-uz*0.05];
  /* 举起 → 喝 → 放下 */
  let k;                                   // 0 = 垂在画面下方，1 = 举到嘴边
  if(u<0.30)      k = u/0.30;
  else if(u<0.72) k = 1;
  else            k = 1-(u-0.72)/0.28;
  /* 仰角：举起时近乎竖直，到位后仰起来喝。
     瓶口朝向 = 沿"前"的反方向往后仰 + 沿"上"抬起 —— 即朝着主人公的脸。 */
  const TILT = 1.15;
  const th = 0.12 + (TILT-0.12)*k;
  const sn=Math.sin(th), cs=Math.cos(th);
  let nx=-fx*sn+ux*cs, ny=-fy*sn+uy*cs, nz=-fz*sn+uz*cs;
  const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
  /* 瓶身沿瓶口朝向的反方向退开半个身位 —— 瓶口正好落在嘴上 */
  const sink = (1-k)*0.22;                 // 没举到位时整瓶往下沉一截
  g.pos = [mouth[0]-nx*L-ux*sink, mouth[1]-ny*L-uy*sink, mouth[2]-nz*L-uz*sink];
  /* 让局部 +Y（瓶口方向）精确指向 n：rx=acos(ny)，ry=atan2(nx,nz) */
  g.rot = [Math.acos(Math.max(-1,Math.min(1,ny))), Math.atan2(nx,nz), 0];
  g.vis = true;
  /* 喝的时候瓶口冒一点气泡 / 挂一滴 */
  if(k>0.85 && u>0.30 && u<0.72 && Math.random()<0.45){
    const mm=[g.pos[0]+nx*L, g.pos[1]+ny*L, g.pos[2]+nz*L];
    const M2 = drinkMat(sp.key);
    Sc.emit(mm[0]+rx*0.025-ux*0.02, mm[1]-uy*0.02, mm[2]+rz*0.025-uz*0.02,
      (Math.random()-.5)*.02, .10+Math.random()*.08, (Math.random()-.5)*.02,
      .26, .55, M2.body.c, 0.4);
  }
  if(u>=1){
    Sc.sip = null; g.vis = false;
    beep(480,.08,'sine',.05); setTimeout(()=>beep(700,.10,'sine',.05),110);
    toast(SIP_MSG[sp.key] || ('🥤 喝了 '+ING[sp.key].n));
    if(S.tab==='kitchen') render();
  }
}

/* 火候成色：这一份菜整体是"欠火"还是"过火"。
   返回 -1(全欠火) ~ 0(正好) ~ +1(全过火)。没有用火步骤的菜返回 null。 */
function heatBias(sess){
  const fl = sess && sess.fireLogs;
  if(!fl || !fl.length) return null;
  let sum = 0;
  for(const f of fl) sum += (f.was - f.need);
  /* 归一化：偏差 2 档算满（火只有 1~3 档，差 2 就是极端） */
  return clamp(sum / (fl.length * 2), -1, 1);
}
/* 火候对成品颜色的改写：
   欠火 → 发白、没上色（水煮的白、炒菜的青）；过火 → 焦褐、发暗。 */
function applyHeatTone(tone, bias){
  if(bias === null || bias === undefined) return tone;
  const k = Math.abs(bias);
  if(k < 0.08) return tone;
  const out = tone.slice();
  const mix = (hex, tr,tg,tb, w)=>{
    const r0=(hex>>16)&255, g0=(hex>>8)&255, b0=hex&255;
    const r=Math.round(r0+(tr-r0)*w), g=Math.round(g0+(tg-g0)*w), b=Math.round(b0+(tb-b0)*w);
    return (r<<16)|(g<<8)|b;
  };
  for(let i=0;i<out.length;i++){
    const v = parseInt(out[i].slice(1),16);
    /* 欠火：往冷白 0xe8e8e0 靠；过火：往焦褐 0x6b4526 靠 */
    const tgt = bias < 0 ? [0xe8,0xe8,0xe0] : [0x6b,0x45,0x26];
    const c = mix(v, tgt[0],tgt[1],tgt[2], k*0.62);
    out[i] = '#'+('000000'+c.toString(16)).slice(-6);
  }
  return out;
}
/* 手法熟练度：同一道菜做得越多，节拍条越短（最高提速 22%）。
   每做一份 +1，上限 30 份吃满。 */
function masteryOf(dishId){ return Math.min(30, (S['熟练'] && S['熟练'][dishId]) || 0); }
function masterySpeed(dishId){
  /* 30 份 → 0.78 倍时长（快 22%） */
  return 1 - 0.22 * (masteryOf(dishId) / 30);
}
function bumpMastery(dishId){
  if(!S['熟练']) S['熟练'] = {};
  S['熟练'][dishId] = Math.min(30, (S['熟练'][dishId]||0) + 1);
}
/* 图鉴：记录最好成绩与次数 */
function bookMark(dishId, grade){
  if(!S.book) S.book = {};
  const lv = (GRADE[grade]||GRADE.ok).lv;
  const e = S.book[dishId] || {best:'ok', times:0, perfect:0};
  e.times++;
  if(grade==='perfect') e.perfect++;
  if(lv > (GRADE[e.best]||GRADE.ok).lv) e.best = grade;
  S.book[dishId] = e;
}
/* 火力与本步要求不匹配 → 判定窗口收窄（火候不对，手感就差） */
function fireMul(){
  const need = bar.reqFire || 0;
  if(!need) return 1;
  const dm = Math.abs((Sc.fireLevel||0) - need);
  return dm===0 ? 1 : (dm===1 ? 0.82 : 0.62);
}
function fireHint(){
  const need = bar.reqFire || 0;
  if(!need) return '';
  const dm = Math.abs((Sc.fireLevel||0) - need);
  if((Sc.fireLevel||0) === need) return '🔥 火候正好';
  return (Sc.fireLevel||0) < need ? '🔥 火太小了' : '🔥 火太大了';
}
function fireHintColor(){
  const need = bar.reqFire || 0;
  if(!need) return 'var(--sub)';
  return (Sc.fireLevel||0)===need ? '#4ce39a' : '#ff8a3d';
}
function tick(now){
  if(!bar.on) return;
  let dt = (now - bar.last)/1000; bar.last = now;
  dt = Math.min(.06, Math.max(0, dt));
  const slowing = bar.slow && S.focus > 0;
  const sdt = dt * (slowing ? 0.42 : 1);
  if(slowing){
    S.focus = Math.max(0, S.focus - dt*62);
    if(S.focus <= 0) setSlow(false);
  }
  if(bar.phase === 'prep'){
    const before = Math.ceil((bar.PREP - bar.pt)*3.4);
    bar.pt += dt;
    const after = Math.ceil((bar.PREP - bar.pt)*3.4);
    if(after !== before && after >= 1) sfxTick();
    window.__phase = -0.35 * (1 - Math.min(1, bar.pt/bar.PREP));
    if(bar.pt >= bar.PREP){ bar.phase = 'run'; sfxTick(); }
  } else {
    bar.pos += sdt / bar.T;
    window.__phase = bar.pos;
    const eta = (bar.target - bar.pos) * bar.T;
    if(!bar.ticked && eta <= 0.26 && eta > -0.1){ bar.ticked = true; sfxTick(); }
    if(bar.pos >= 1){ bar.pos = 1; updateBarUI(); judge(true); return; }
  }
  updateBarUI();
  bar.raf = requestAnimationFrame(tick);
}
function updateBarUI(){
  const cur = byId('cursor'); if(cur) cur.style.left = (bar.pos*100)+'%';
  const ring = byId('beatring');
  if(ring){
    ring.style.left = (bar.target*100)+'%';
    const d = Math.abs(bar.pos - bar.target);
    ring.style.transform = 'scale('+(0.45+Math.min(1.15, d*3.2))+')';
    ring.style.opacity = String(0.35 + Math.max(0, 0.65 - d*2));
  }
  const tl = byId('tl');
  if(tl) tl.style.width = ((bar.phase==='prep' ? bar.pt/bar.PREP : bar.pos)*100)+'%';
  const ff = byId('focusfill');
  if(ff){ ff.style.width = S.focus+'%'; const fb=byId('focusbar'); if(fb) fb.classList.toggle('low', S.focus<25); }
  const pr = byId('prep');
  if(pr){
    if(bar.phase==='prep'){
      pr.style.display='flex';
      pr.textContent = '预备 · ' + Math.max(1, Math.ceil((bar.PREP-bar.pt)*3.4));
    } else pr.style.display='none';
  }
}
function syncFire(){
  document.querySelectorAll('[data-act="fire"]').forEach(b=>{
    const id = +b.dataset.id;
    b.className = 'firebtn' + (id===(Sc.fireLevel||0) ? ' on l'+Sc.fireLevel : (id===0?' off':''));
  });
  const h = byId('firehint');
  if(h && S.session && S.session.phase==='cook'){
    const idx = S.session.idx, d = dishOf(S.session.dishId);
    const need = S.session.isKindle ? 0 : ((STEPS[flowOf(S.session)[idx]]||{}).fire||0);
    h.style.color = fireHintColor();
    h.textContent = need ? ('需要 '+['小火','中火','大火'][need-1]+' · '+fireHint())
                         : (S.session.isKindle ? '现在点火' : '这一步不用火');
  }
}
function setSlow(v){
  bar.slow = v;
  const b = byId('bar'); if(b) b.classList.toggle('slowed', v);
  const h = byId('actBtn'); if(h && bar.on) h.classList.toggle('press', v);
}
function judge(auto){
  if(!bar.on || bar.phase==='prep') return;
  bar.on = false; setSlow(false);
  cancelAnimationFrame(bar.raf);
  const mul = fireMul();
  const dist = Math.abs(bar.pos - bar.target) / mul;
  const r = auto ? 'miss' : (dist<=SW.perfect ? 'perfect' : dist<=SW.great ? 'great' : dist<=SW.good ? 'good' : 'miss');
  sfx(r); Stage.hit(r);
  const sess = S.session; if(!sess) return;
  if(sess.isKindle){
    // 点火不算菜品步骤，只决定起火的档位
    const lv = (r==='perfect'||r==='great') ? 2 : (r==='good' ? 1 : 0);
    Sc.fireLevel = lv;
    if(lv===0){
      toast('没点着… 再来一次');
      setTimeout(startStep, 700);
    } else {
      toast(lv===2 ? '🔥 中火，一次打着' : '🔥 小火，火有点弱');
      sess.isKindle = false;
      setTimeout(startStep, 700);
    }
    return;
  }
  sess.logs.push(r);
  /* 火候记录：需求档 vs 实际档。用于成品成色（火大上色深、火小发白） */
  const nf = bar.reqFire || 0;
  if(nf > 0){
    if(!sess.fireLogs) sess.fireLogs = [];
    sess.fireLogs.push({need:nf, was:(Sc.fireLevel||0)});
  }
  /* 摆盘这一步：成绩直接决定点缀摆得整不整 */
  if(flowOf(sess)[sess.idx] === 'garnish'){
    setTimeout(()=>{ if(Sc && Sc.setPlatingQuality) Sc.setPlatingQuality(r); }, 40);
  }
  if(r==='perfect') S.combo++; else S.combo = 0;
  S.focus = Math.min(100, S.focus + 22);
  popVerdict(auto, r);
  renderDots();
  setTimeout(nextStep, 720);
}
function nextStep(){
  const sess = S.session; if(!sess || !sess.dishId) return;
  sess.idx++;
  if(sess.idx < flowOf(sess).length) startStep();
  else finishDish();
}
/* ===================== 打包：亲友邻里 vs 顾客 =====================
   📄 订单纸（好友 / 亲朋 / 邻里）：装盒就够，亲手交给对方
   📞 电话（顾客）：装盒 → 装袋 → 送到门口，外卖自取
   自己练手（无订单）不用打包，装盘就好。 */
function packSteps(sess){
  const ord = sess.orderId ? S.orders.find(o=>o.id===sess.orderId) : null;
  if(!ord) return [];
  /* 顾客：装盒 → 装袋，袋子封好后得自己去拿车钥匙送出去 */
  return ord.src === 'phone' ? ['box','bag'] : ['box'];
}
/* 这一份的完整流程：菜品步骤 + 打包步骤 */
function flowOf(sess){
  if(sess.flow) return sess.flow;
  sess.flow = dishOf(sess.dishId).steps.concat(packSteps(sess));
  return sess.flow;
}

/* ===================== 一份菜的流程 ===================== */
function beginDish(dishId, need, orderId){
  S.session = {dishId, need, made:0, orderId:orderId||null, idx:0, logs:[], totalGold:0, totalRep:0, phase:'cook', flow:null};
  portionFold = false;   // 新一轮出餐：结算重新展开，之后保持玩家的折叠选择
  S.combo = 0; S.focus = 100;
  save(); nextDishPortion();
}
function nextDishPortion(){
  const sess = S.session, d = dishOf(sess.dishId);
  if(sess.made >= sess.need){ endSession(); return; }
  if(maxMake(d) < 1){ toast('食材不够了，去市场补货吧'); sess.phase='done'; renderKitchen(); return; }
  for(const [k,v] of Object.entries(d.ing)) S.stock[k] = (S.stock[k]||0) - v;
  sess.idx = 0; sess.logs = []; sess.phase = 'cook';
  sess.flow = null;                     // 重算：订单来源可能不同
  renderKitchen();
  startStep();
}
function dishGrade(logs){
  const miss = logs.filter(x=>x==='miss').length;
  const non  = logs.filter(x=>x!=='perfect').length;
  if(miss>=2) return 'fail';
  if(miss===1 && non>=4) return 'fail';
  if(miss===0 && non<=2) return 'perfect';
  if(miss===0 && non<=4) return 'great';
  if(miss<=1) return 'good';
  return 'ok';
}
/* ===================== 黑暗料理：失败的产物 =====================
   做砸了不是"没做出来"，而是真的得到一盘没法吃的东西。
   按失败的原因命名：过火=炭化、欠火=夹生、纯手抖=不成形…… */
const DARK_TONE = [0x2e2620, 0x4a3a2a, 0x1e1a16];   // 焦黑 / 暗褐 / 死黑
function darkReason(sess, d){
  const heat = heatBias(sess);
  const miss = (sess.logs||[]).filter(x=>x==='miss').length;
  const hasCut = (d.steps||[]).some(s=>['cut','slice','dice','shred','score','carve'].indexOf(s)>=0);
  if(heat !== null && heat > 0.25)  return {k:'burnt',  n:'炭化', d:'火太大，整锅烧过头了'};
  if(heat !== null && heat < -0.25) return {k:'raw',    n:'夹生', d:'火没跟上，里面还是生的'};
  if(miss >= 3)                     return {k:'mess',   n:'不成形', d:'手忙脚乱，形状彻底散了'};
  if(hasCut)                        return {k:'chop',   n:'碎尸', d:'刀下得太狠，碎得看不出原样'};
  return {k:'bland', n:'齁咸', d:'调味失手，咸得发苦'};
}
function darkDishOf(dishId, sess){
  const d = dishOf(dishId);
  const r = darkReason(sess, d);
  const nm = {burnt:'炭化'+d.n, raw:'夹生'+d.n, mess:'不成形的一坨',
    chop:'碎尸'+d.n, bland:'齁咸'+d.n}[r.k];
  return {id:dishId, name:nm, reason:r, src:d.n};
}
/* 记进黑暗料理图鉴 */
function darkMark(dishId, sess){
  if(!S.dark) S.dark = {};
  const it = darkDishOf(dishId, sess);
  const e = S.dark[dishId] || {times:0, kinds:{}};
  e.times++;
  e.kinds[it.reason.k] = (e.kinds[it.reason.k]||0) + 1;
  e.last = it.name;
  S.dark[dishId] = e;
  return it;
}
function finishDish(){
  const sess = S.session, d = dishOf(sess.dishId);
  const g = dishGrade(sess.logs);
  const ord = sess.orderId ? S.orders.find(o=>o.id===sess.orderId) : null;
  const comboK = 1 + Math.min(0.5, Math.max(0, S.combo-1)*0.1);
  const gold = Math.round(d.price * GRADE[g].mul * (ord?1:0.7) * comboK);
  const rep = GRADE[g].rep;
  S.gold += gold; S.rep = Math.max(0, S.rep + rep);
  sess.made++; sess.totalGold += gold; sess.totalRep += rep;
  sess.lastGrade = g; sess.lastLogs = sess.logs.slice(); sess.lastGold = gold;
  /* 每完成一份：熟练度 +1、图鉴记一笔 */
  bumpMastery(sess.dishId); bookMark(sess.dishId, g);
  /* 做砸了 → 得到一盘黑暗料理（失败产物），端上桌也是这个 */
  if(g === 'fail'){ sess.dark = darkMark(sess.dishId, sess); }
  sess.phase = 'portion';
  const pk = packSteps(sess);
  sess.packed = pk.length > 0;
  /* 顾客单：袋子封好了，得去拿车钥匙才送得出去 */
  sess.awaitKey = !!(ord && ord.src === 'phone');
  save(); renderTop(); renderKitchen();
  // 成品：顾客 = 袋装待送；亲友邻里 = 盒装；自己练手 = 装盘
  Stage.mount(sess.awaitKey ? 'bagged' : (sess.packed ? 'boxed' : 'plated'), d, g);
  if(sess.awaitKey){
    toast('🥡 装好袋了 · 去拿车钥匙送出去');
    setTimeout(()=>toast('🚗 车钥匙在备料台那一头'), 1600);
  } else if(sess.packed){
    toast('🍱 装盒完成 · 交给 '+(ord?ord.c:'亲友'));
  }
  syncTableDishes();
}
function endSession(){ S.session.phase = 'summary'; renderKitchen(); Stage.mount('idle', dishOf(S.session.dishId)); }
function closeSession(){ S.session = null; S.activeOrder = null; render(); }

function render(){

  const v = byId('views'), isK = (S.tab==='kitchen');
  /* 抽屉是整块重建的（v.innerHTML = ...），重建会丢掉滚动位置。
     在市场里点一次「+1」就把列表弹回顶部、得重新滑下去 —— 记住并还原。 */
  const oldDr = v.querySelector('.drawer');
  const keepScroll = (oldDr && S.tab === render._lastTab) ? oldDr.scrollTop : 0;
  // 面板是"抽屉"：菜谱/订单/笔记/市场从底部升起，3D 画面始终在背后
  let html = '';
  if(!isK){
    if(S.tab==='market') html = viewMarket();
    else if(S.tab==='recipes') html = viewRecipes();
    else if(S.tab==='orders') html = viewOrders();
    else if(S.tab==='book') html = viewBook();

    else html = viewNotes();
  } else {
    // 厨房待机提示只是一张小卡片，浮在画面底部；不能变成占半屏的抽屉
    const kh = byId('kitch');
    if(kh) kh.innerHTML = S.session ? '' : viewKitchen();
  }
  /* 抽屉三种收起方式：右上角 ✕、点抽屉外的画面、再点一次当前页签 */
  v.innerHTML = html
    ? ('<div class="drawerbg" data-closebg="1"></div>'
       + '<div class="drawer"><div class="dbar"><button data-act="back" aria-label="收起">✕</button></div>'
       + html + '</div>')
    : '';
  const bgEl = v.querySelector('[data-closebg]');
  if(bgEl) bgEl.addEventListener('click', ()=>{ if(S.tab!=='kitchen') actions.back(); });
  const newDr = v.querySelector('.drawer');

    if(S.tab === render._lastTab && keepScroll) newDr.scrollTop = keepScroll;

  } else render._lastTab = null;
  renderTop(); bindDynamic();
  // 3D 常驻：任何页签都继续渲染，它就是整个画面
  Stage.start();
  const cr = byId('cross');
  if(cr) cr.style.display = isK ? '' : 'none';
  if(isK){
    /* 已经在待机布景了就别再摆一次：mount 会把人送回炉灶，
       于是"走到备料台 → 点车钥匙买菜 → 回来"就被瞬移走，车钥匙再也瞄不到。 */
    /* 首次进厨房必须真正摆一次待机布景（隐藏厨师、收起蒸笼等散件）；
       之后只在"确实收工"时由各出口显式调用，切页签回来不再重摆 —— 否则
       走到备料台点车钥匙买完菜回来，人会被瞬移回炉灶。 */
    if(!S.session){ if(!Sc._laid){ Sc._laid = true; Stage.mount('idle', null); } clearHud();
      setHudAnno({hint:'后厨待命 · 灶火未启 · 摇杆走动 / 360° 环视，准心对准东西点右下按钮'}); }
    else if(S.session.phase==='ready') renderReady();
    else if(S.session.phase==='cook'){ renderKitchen(); if(!bar.on && S.session.stage==='beat') beginBeat(); }
    else renderKitchen();
  } else { clearHud(); const kk=byId('kitch'); if(kk) kk.innerHTML=''; }
  bindStage(); bindActBtn(); bindJoystick();
  requestAnimationFrame(layoutActBtn);
}
