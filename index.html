/* ===================== 左摇杆：自主走动 ===================== */
/* 摇杆量以"屏幕"为准：↑=前、↓=后、←=左、→=右。
   每帧再按相机朝向投到世界 XZ，所以前永远是屏幕里的前，不会随转头乱套。 */
const MOVE = {x:0, y:0, on:false, spd:1.85};
function bindJoystick(){
  const base = byId('jobase'), knob = byId('joknob');
  if(!base || base.__bound) return;
  base.__bound = 1;
  const R = 34;                       // 摇杆行程半径（px）
  let id = null, cx=0, cy=0;
  const setKnob=(dx,dy)=>{ knob.style.transform = 'translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)'; };
  const start=(e)=>{
    if(id!==null) return;
    id = e.pointerId;
    const r = base.getBoundingClientRect();
    cx = r.left + r.width/2; cy = r.top + r.height/2;
    MOVE.on = true; base.classList.add('act');
    try{ base.setPointerCapture(e.pointerId); }catch(_){}
    move(e);
  };
  const move=(e)=>{
    if(e.pointerId!==id) return;
    let dx = e.clientX-cx, dy = e.clientY-cy;
    const L = Math.hypot(dx,dy);
    if(L > R){ dx = dx/L*R; dy = dy/L*R; }
    setKnob(dx,dy);
    MOVE.x = dx/R; MOVE.y = -dy/R;    // 屏幕 y 向下 → 取负，↑ 才是前
  };
  const end=(e)=>{
    if(e.pointerId!==id) return;
    id = null; MOVE.on = false; MOVE.x = 0; MOVE.y = 0;
    base.classList.remove('act'); setKnob(0,0);
  };
  base.addEventListener('pointerdown', start);
  base.addEventListener('pointermove', move);
  base.addEventListener('pointerup', end);
  base.addEventListener('pointercancel', end);
}
/* 房间可行走范围（贴着墙留一点余量） */
const ROOM = {x0:ROOMB.x0+0.42, x1:ROOMB.x1-0.42, z0:ROOMB.z0+0.34, z1:ROOMB.z1-0.50};
/* 家具占位（俯视 AABB）：走过去会被挡住，不会穿模 */
const OBST = [
  {x0:-1.74, x1:1.74,  z0:-0.53, z1:0.56},   // 厨房台面（含水槽/灶台）
  {x0:1.80,  x1:2.80,  z0:-0.49, z1:0.36},   // 烤箱柜
  {x0:-2.48, x1:-1.48, z0:-1.20, z1:-0.40},  // 冰箱
  {x0:3.45,  x1:5.05,  z0:-0.66, z1:0.35},   // 餐桌
  {x0:4.93,  x1:6.27,  z0:-1.13, z1:-0.67},  // 电视柜
  {x0:4.63,  x1:6.57,  z0:0.43,  z1:1.28},   // 沙发
  {x0:6.63,  x1:6.97,  z0:1.43,  z1:2.77},   // 书架
  {x0:6.31,  x1:6.79,  z0:-0.83, z1:-0.37},  // 落地灯
  {x0:6.34,  x1:6.78,  z0:2.88,  z1:3.32},   // 盆栽（右前墙角）
  {x0:4.05,  x1:5.05,  z0:3.14,  z1:3.56}    // 饮料柜（贴前墙，门朝房间内）
];
const PR = 0.27;                              // 身体半径
function blockedAt(x,z){
  if(x<ROOM.x0||x>ROOM.x1||z<ROOM.z0||z>ROOM.z1) return true;
  for(let i=0;i<OBST.length;i++){
    const o=OBST[i];
    if(x+PR>o.x0 && x-PR<o.x1 && z+PR>o.z0 && z-PR<o.z1) return true;
  }
  return false;
}
/* 卡在家具里时（比如从沙发上站起来）挪到最近的空位 */
function freeSpot(x,z){
  if(!blockedAt(x,z)) return [x,z];
  for(let r=0.36;r<=1.8;r+=0.24){
    for(let i=0;i<12;i++){
      const a=i/12*Math.PI*2;
      const nx=x+Math.cos(a)*r, nz=z+Math.sin(a)*r;
      if(!blockedAt(nx,nz)) return [nx,nz];
    }
  }
  return [x,z];
}

/* 右下角交互按键：准心对准什么，点它就操作什么 */
function bindActBtn(){
  const b = byId('actBtn');
  if(!b || b.__bound) return;
  b.__bound = 1;
  /* 做菜中这个键就是「停」：轻点 = 把滑块停在判定点；按住 = 凝神（时间放慢）。
     平时才是交互键。 */
  let holdT = 0, slowed = false;
  const clear = ()=>{ if(holdT){ clearTimeout(holdT); holdT = 0; } if(slowed){ setSlow(false); slowed = false; } };
  b.addEventListener('pointerdown', e=>{
    e.preventDefault();
    clear();
    if(bar.on && bar.phase !== 'prep'){
      if(S.focus > 0) holdT = setTimeout(()=>{ slowed = true; setSlow(true); }, 170);
      return;
    }
  });
  b.addEventListener('pointerup', e=>{
    e.preventDefault();
    const wasHold = slowed;
    clear();
    if(bar.on && bar.phase !== 'prep'){ if(!wasHold) judge(false); return; }
    if(Sc.busy) return;
    const h = Sc.hover;
    if(!h){ toast('先用准心对准要用的东西'); beep(320,.07,'square',.04); return; }
    engage();
  });
  b.addEventListener('pointercancel', clear);
  b.addEventListener('pointerleave', clear);
  b.addEventListener('click', e=>{ e.preventDefault(); });   // 只走 pointerup，避免双重触发
}
/* 交互按键要浮在底部 HUD 之上，位置随 HUD 高度变化 */
function layoutActBtn(){
  const pad = byId('actpad'), joy = byId('joypad');
  const ch = byId('cookhud'), kh = byId('kitch');
  let h = 0;
  try{
    if(ch) h = Math.max(h, ch.getBoundingClientRect().height);
    if(kh) h = Math.max(h, kh.getBoundingClientRect().height);
  }catch(e){}
  const b = 'calc(' + (62 + Math.round(h) + 10) + 'px + env(safe-area-inset-bottom))';
  if(pad) pad.style.bottom = b;
  if(joy) joy.style.bottom = b;      // 摇杆和交互键同高，别压住底部卡片
}

/* 第一人称操作：拖动 = 转头环视；轻点 = 用准心交互 / 出手 */
function bindStage(){
  const cv = byId('stage');
  if(!cv || cv.__bound) return;
  cv.__bound = 1;
  let drag = null;
  cv.addEventListener('pointerdown', e=>{
    drag = {x:e.clientX, y:e.clientY, yaw:FP.tYaw, pitch:FP.tPitch, moved:0};
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  });
  cv.addEventListener('pointermove', e=>{
    if(!drag) return;
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
    if(drag.moved > 7){
      /* 左右不设限：可以一直朝同一个方向转下去（真正的 360° 环视）。
         以前 clamp 在 ±180°，转到头就撞墙、必须反着划回来。 */
      FP.tYaw   = drag.yaw   - dx*0.0045;
      FP.tPitch = clamp(drag.pitch - dy*0.0038, FP_LIM.pitDn, FP_LIM.pitUp);
    }
  });
  const end = ()=>{
    if(!drag) return;
    const tap = drag.moved <= 10;      // 阈值放宽，手指微抖不再算"点击"
    drag = null;
    // 待机说明展开了：点画面上任意一处也收起
    if(tap && idleOpen && !S.session){
      idleOpen = false; const kk = byId('kitch');
      if(kk){ kk.innerHTML = viewKitchen(); bindDynamic(); }
    }
    if(!tap) return;
    /* 轻点画面只用来「节奏进行中出手」。
       交互一律走右下角按钮 —— 拖动环视时不会再误触电话/订单纸/灶火旋钮。 */
    if(bar.on && bar.phase !== 'prep') judge(false);
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', ()=>{ drag=null; });
}
function bindDynamic(){
  /* 必须幂等：同一元素被绑两次 click，开关类动作会一开一关互相抵消，
     表现就是"点了没反应 / 收不回去"。 */
  document.querySelectorAll('[data-act]').forEach(el=>{
    if(el.__bd) return;
    el.__bd = 1;
    el.style.touchAction = 'manipulation';
    el.addEventListener('click', ev=>{
      const a = el.dataset.act, id = el.dataset.id;
      actions[a] && actions[a](id, el);
    });
  });
  /* 搜索框之类：input 事件走 actions[data-inp] */
  document.querySelectorAll('[data-inp]').forEach(el=>{
    if(el.__bi) return;
    el.__bi = 1;
    el.addEventListener('input', ev=>{
      const a = el.dataset.inp;
      actions[a] && actions[a](el.value, el);
    });
    /* 回车收起软键盘 */
    el.addEventListener('keydown', ev=>{ if(ev.key==='Enter') el.blur(); });
  });
}

   装盒 → 装袋 → 拿车钥匙 → 送出。袋子封好后必须自己去拿钥匙。 */
function deliverTakeout(){
  const sess = S.session; if(!sess || !sess.awaitKey) return;
  const o = S.orders.find(x=>x.id===sess.orderId);
  if(!o) return;
  const g = sess.lastGrade;
  if(LV[g] < o.req){ toast('还不够 '+GRADEname(o.req)+'，再练一份吧'); return; }
  if(sess.made < sess.need){ toast('还有 '+(sess.need-sess.made)+' 份没做完'); return; }
  S.gold += o.gold; S.rep += o.rep;
  S.orders = S.orders.filter(x=>x.id!==o.id);
  while(S.orders.length<4) S.orders.push(newOrder());
  sess.awaitKey = false;
  beep(760,.10,'sine',.06); setTimeout(()=>beep(1020,.14,'sine',.06),120);
  toast('🛵 出发送餐！'+o.c+' 很满意 +'+o.gold+'💰 +'+o.rep+'🏅');

}

/* 没接单自己做的菜：端上餐桌，坐下慢慢尝，得出自己的结论 */
/* 桌面四个槽位是固定的：菜放在哪个槽就一直在哪个槽。
   之前用数组下标，尝掉第 1 份后面几份会整体往前挪一格 —— 看着像凭空瞬移。 */
function tableFreeSlot(){
  const used = {};
  S.table.forEach(it=>{ if(it && it.slot!=null) used[it.slot]=1; });
  for(let i=0;i<4;i++) if(!used[i]) return i;
  return -1;
}
function syncTableDishes(){
  if(!Sc.tdMats || !Sc.n.td0) return;
  for(let i=0;i<4;i++){ const t=Sc.n['td'+i]; if(t) t.vis=false; }
  S.table.forEach((it,idx)=>{
    if(!it) return;
    if(it.slot==null) it.slot = tableFreeSlot();           // 老存档补槽位
    const i = it.slot; if(i<0 || i>3) return;
    const t = Sc.n['td'+i]; if(!t) return;
    t.vis = true;
    const d = dishOf(it.dish);
    const tone = it.dark ? ['#2e2620','#4a3a2a','#1e1a16']
                         : applyHeatTone(Sc.dishTone(d), (it.heat===undefined?null:it.heat));
    for(let k=0;k<3;k++) Sc.tdMats[i][k].c = parseInt(tone[k].slice(1),16);
    Sc.tdSauceMats[i].c = parseInt(tone[2].slice(1),16);
    const vs = t['_vessel_tdV'+i];
    if(vs) vs.set(vesselOf(d));
  });
}

function tasteDish(nodeKey){
  if(Sc._eat){ return; }                       // 正在吃，别重复触发
  const i = parseInt(String(nodeKey).replace('td',''),10);
  const it = S.table.find(x=>x && x.slot===i);
  if(!it){ toast('盘子里空空的'); return; }
  const d = dishOf(it.dish);
  /* 黑暗料理（做砸了）→ 焦苦的结论；人见打 → 猎奇的结论；其余按成绩 */
  const isDark = !!it.dark, isChaos = !!(d && d.chaos);
  toast(isDark ? ('💀 硬着头皮尝 '+d.e+d.n) : (isChaos ? ('👊 豁出去了 '+d.e+d.n) : ('🍽️ 开动 '+d.e+d.n)));
  beep(isDark?300:560,.07,'sine',.05);
  /* 一口一口吃掉：三块食材依次缩小消失，吃干净了才撤盘、结算 */
  Sc._eat = {slot:i, t:0, after:()=>{
    const g = it.grade, G = GRADE[g];
    let note, repGain;
    if(isDark){
      const rk = (it.dark && it.dark.reason && it.dark.reason.k) || 'bland';
      const pool = DARK_TASTE[rk] || DARK_TASTE.bland;
      note = pool[Math.floor(Math.random()*pool.length)];
      repGain = -1;                       // 端上桌一盘焦炭，声望要掉
    }else if(isChaos){
      note = CHAOS_TASTE[Math.floor(Math.random()*CHAOS_TASTE.length)];
      repGain = g==='perfect' ? 2 : 1;    // 猎奇完成度也值一点心得
    }else{
      const pool = TASTE[g] || TASTE.ok;
      note = pool[Math.floor(Math.random()*pool.length)];
      repGain = g==='perfect' ? 3 : g==='great' ? 2 : g==='good' ? 1 : 0;
    }
    S.rep = Math.max(0, S.rep + repGain); S.tasted++;
    S.table = S.table.filter(x=>x !== it);
    syncTableDishes(); save(); renderTop();
    beep((isDark||g==='fail')?220:620,.10,'sine',.06);
    setTimeout(()=>beep((isDark||g==='fail')?180:880,.14,'sine',.06),120);
    showTasteCard(d, isDark?'dark':(isChaos?'chaos':g), G, note, repGain, it.dark);
  }};
}

/* 菜谱缩略图：用 CSS 画一个俯视的成品示意 ——
   器皿轮廓（圆/碗/坛/长盘）+ 主料色块 + 汁色底 + 点缀绿。
   纯 DOM，不占 3D 渲染预算。 */
function dishThumb(d){
  const tone = Sc.dishTone(d);
  const A='#'+tone[0].slice(1), B='#'+tone[1].slice(1), C='#'+tone[2].slice(1);
  const v = vesselOf(d);
  const cat = ING_SHAPE[Sc.primaryIng(d)] || 'root';
  /* 主料在盘里的排布：方阵码 / 围圈 / 卧中 / 松散堆 */
  let inner = '';
  const mk=(x,y,w,h,r,c)=>`<i style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;border-radius:${r};background:${c}"></i>`;
  if(cat==='tofu' || cat==='meat'){
    for(let gx=0;gx<3;gx++) for(let gy=0;gy<3;gy++)
      inner += mk(24+gx*20, 24+gy*20, 14, 14, '20%', (gx+gy)%2?A:B);
  } else if(cat==='fish' || cat==='melon'){
    inner += mk(12, 42, 76, 16, '45%', A);
    inner += mk(24, 30, 20, 10, '40%', B);
    inner += mk(56, 56, 18, 9,  '40%', B);
  } else if(cat==='shrimp' || cat==='shell'){
    for(let i=0;i<7;i++){
      const a=i/7*Math.PI*2;
      inner += mk(50+Math.cos(a)*30-6, 50+Math.sin(a)*30-6, 13, 13, '50%', i%2?A:B);
    }
  } else {
    const R=[[32,30],[58,26],[50,50],[28,54],[62,56],[42,68],[58,72]];
    for(let i=0;i<7;i++) inner += mk(R[i][0]-7, R[i][1]-7, 15, 15, '45%', i%2?A:B);
  }
  const cls = v==='bowl' ? 'th-bowl' : v==='urn' ? 'th-urn' : v==='platter' ? 'th-platter' : 'th-plate';
  return `<span class="dthumb ${cls}" style="--juice:${C}">
    <b class="th-food">${inner}</b>
    <u class="th-g1"></u><u class="th-g2"></u><u class="th-g3"></u>
  </span>`;
}
function viewRecipes(){
  /* 分组折叠收纳：116 道菜摊平会滑到手酸，按经典/地方/国宴/作死收成四栏 */
  const all = dishList();
  const q = String(S.rcq||'').trim();
  const bucket = {};
  for(const g of GROUPS) bucket[g.k] = [];
  for(const d of all){

  /* 一道菜的卡片 */
  const cardHTML = d=>{
    const m = maxMake(d);
    return `<div class="card">

      ${masteryOf(d.id)>0 ? `<div class="small" style="margin-top:4px;color:${masteryOf(d.id)>=30?'#4ce39a':'#ffc247'}">🏅 熟练 ${masteryOf(d.id)}/30${masteryOf(d.id)>=30?' · 已至纯熟 · 节拍快 '+Math.round((1-masterySpeed(d.id))*100)+'%':' · 节拍快 '+Math.round((1-masterySpeed(d.id))*100)+'%'}</div>`:''}
      ${m ? `<button class="btn" style="margin-top:10px" data-act="cook" data-id="${d.id}">🔥 开火（可做 ${m} 份）</button>`

  for(const g of GROUPS){
    const list = bucket[g.k] || [];

    /* 搜索时把命中的分栏自动展开：不然搜到了还得一个个点开，等于没搜 */
    const open = q ? true : !!S.rcOpen[g.k];

    h += `<div class="card rcgrp${open?' open':''}" style="padding:0;overflow:hidden">

      </button>

}
/* ---- 订单 ---- */
function genOrders(){ return [newOrder('friend'), newOrder('customer'), newOrder('friend'), newOrder('customer')]; }
/* kind: 'friend'=亲友邻里（订单纸） / 'customer'=顾客（电话） */
function newOrder(kind){
  /* 人见打料理不进订单：没有顾客会正经下单要一份"榴莲螺蛳粉"，
     它只能是你解锁后自己在菜谱里猎奇用的。 */
  const all = dishList().filter(d=>!d.chaos);
  /* 国宴级订单要够格才接得到：声望不足时它不会出现在订单板上 */
  const noM = all.filter(d=>!d.master);
  const d = rnd((S.rep >= MASTER_REP || !noM.length) ? all : noM);
  const req = Math.max(1, Math.min(4, Math.round(d.s*0.6) + (Math.random()<.4?1:0)));
  const want = kind==='customer' ? ['顾客'] : KIN_T;   // 订单纸：好友/亲朋/邻里；电话：顾客
  let pool = CUSTOMERS.filter(c=>want.indexOf(c.t)>=0);
  if(!pool.length) pool = CUSTOMERS;
  const c = rnd(pool);
  return {id:'o'+Math.random().toString(36).slice(2,8), dish:d.id, req, c:c.n, ce:c.e, ct:c.t,
    src: kind==='customer' ? 'phone' : 'paper',
    gold:Math.round(d.price*2.2*(1+.28*req)), rep:4+req*4};
}
function migrateOrders(){
  if(!S.orders) return;
  for(const o of S.orders) if(!o.src) o.src = (o.ct==='顾客') ? 'phone' : 'paper';
}
function refreshOrders(){
  S.orders = S.orders.filter(o=>o.src==='phone' ? false : true);   // 只换掉亲友单，电话单要自己接
  while(S.orders.length<4) S.orders.push(newOrder('friend'));
  save(); render();
}

const actions = {
  cook(id){
    S.tab = 'kitchen';
    S.session = {dishId:id, need:1, made:0, orderId:null, idx:0, logs:[], totalGold:0, totalRep:0, phase:'ready', flow:null};
    S.pendingQty = 1;
    render();
  },
  take(id){
    const o = S.orders.find(x=>x.id===id);
    if(maxMake(dishOf(o.dish))<1){ toast('食材不足'); return; }
    S.activeOrder = o.id; S.tab='kitchen';
    S.session = {dishId:o.dish, need:1, made:0, orderId:o.id, idx:0, logs:[], totalGold:0, totalRep:0, phase:'ready', flow:null};
    render();
  },
  refresh(){ refreshOrders(); },
  callPhone(){ ringOrder('customer'); },
  readPaper(){ ringOrder('friend'); },
  buy(id){ buyIng(id,1); }, buy5(id){ buyIng(id,5); }, buy10(id){ buyIng(id,10); },
  buyFor(id){ buyForDish(id, 1); },
  buyForOrder(id){
    const o = S.orders.find(x=>x.id===id); if(!o) return;
    buyForDish(o.dish, o.req);
  },
  unlock(){
    if(S.note) return;
    if(S.gold<NOTE_COST.gold || S.rep<NOTE_COST.rep){ toast('条件不足'); return; }
    S.gold -= NOTE_COST.gold; S.note = true; save();
    toast('📓 厨神的笔记已解锁！判定区与节拍环显形'); beep(880,.12,'triangle',.07);
    setTimeout(()=>beep(1200,.16,'triangle',.07),110);
    render();
  },
  demo(){ S.note = true; save(); toast('演示模式：笔记已解锁'); render(); },
  reset(){
    if(!confirm('确定重置存档？金币、食材、笔记都会归零。')) return;
    localStorage.removeItem(SAVE_KEY);
    S = {gold:300,rep:0,stock:defaultStock(),note:false,mute:false,orders:genOrders(),activeOrder:null,tab:'kitchen',combo:0,focus:100,session:null,table:[],tasted:0};
    save(); render();
  },
  start(){
    const sess = S.session; if(!sess) return;
    if(Sc.sitting){ Sc.sitting = false; refreshEye(); }
    sess.need = S.pendingQty||1;
    beginDish(sess.dishId, sess.need, sess.orderId);
  },
  qty(delta){
    const d = dishOf(S.session.dishId);
    const max = Math.max(1, maxMake(d));
    S.pendingQty = Math.max(1, Math.min(max, (S.pendingQty||1)+parseInt(delta,10)));
    renderReady();
  },
  abort(){
    if(!confirm('收火会损失这一份的食材，确定？')) return;
    bar.on=false; cancelAnimationFrame(bar.raf);
    S.session = null; render();
  },
  nextPortion(){ nextDishPortion(); },
  foldPortion(){ portionFold = true; renderKitchen(); },
  keyHint(){ toast('🚗 车钥匙在备料台那一头 · 正亮着金光'); },
  unfoldPortion(){ portionFold = false; renderKitchen(); },
  /* 没接单自己做的：端上餐桌，回头坐下慢慢尝 */
  toTable(){
    const sess = S.session; if(!sess) return;
    if(Sc._serve !== null && Sc._serve !== undefined){ return; }   // 端菜中
    const slot = tableFreeSlot();
    if(slot < 0){ toast('餐桌摆满了，先尝掉一些'); return; }
    const dishId = sess.dishId, grade = sess.lastGrade||'ok';
    const d = dishOf(dishId);
    S.session = null; S.activeOrder = null;
    /* 真的端到桌上：镜头走到餐厅，盘子从手里落到餐桌空位，落定才算摆好 */
    toast('端去餐桌…');
    Stage.serveToTable(slot, dishId, grade, heatBias(sess), sess.dark||null);
    render();
  },
  stop(){ if(S.session) S.session.need = S.session.made; endSession(); },
  summary(){ endSession(); },
  close(){ closeSession(); },
  deliver(){
    const sess = S.session, o = S.orders.find(x=>x.id===sess.orderId);
    if(!o) return;
    S.gold += o.gold; S.rep += o.rep;
    S.orders = S.orders.filter(x=>x.id!==o.id);
    while(S.orders.length<4) S.orders.push(newOrder());
    toast(o.src==='phone'
      ? `🛍️ 已放门口，${o.c}取走了！+${o.gold}💰 +${o.rep}🏅`
      : `🍱 装好盒交给${o.c}！+${o.gold}💰 +${o.rep}🏅`);
    save(); S.session=null; S.activeOrder=null; S.tab='orders'; render();
  },
  redo(){
    const sess = S.session;
    if(maxMake(dishOf(sess.dishId))<1){ toast('食材不够了'); return; }
    sess.need = sess.made + 1;
    nextDishPortion();
  },
  giveup(){
    S.rep = Math.max(0, S.rep-5);
    toast('订单取消，声望 -5');
    S.session = null; S.activeOrder = null; save(); render();
  },
  mute(){ S.mute = !S.mute; save(); render(); toast(S.mute?'音效已关闭':'音效已开启'); },
  help(){ idleOpen=false; S.tab='help'; render(); },
  toggleIdle(){ idleOpen = !idleOpen; const k=byId('kitch'); if(k) k.innerHTML = viewKitchen(); bindDynamic(); requestAnimationFrame(layoutActBtn); },
  /* 菜谱分栏折叠：记住开关状态并重绘抽屉，滚动位置由 render() 兜住 */
  rcToggle(id){
    if(!S.rcOpen) S.rcOpen = {classic:true, local:false, master:false, chaos:false};
    S.rcOpen[id] = !S.rcOpen[id];
    save(); render();
  },
  /* 一键展开/收起全部分栏 */
  rcAll(id){
    const on = id === 'open';
    S.rcOpen = {classic:on, local:on, master:on, chaos:on};
    save(); render();
  },
  /* 搜索：防抖重绘（116 道菜每敲一个字就重绘会卡），重绘后把焦点和光标还给输入框 */
  rcSearch(v){
    S.rcq = String(v||'');
    clearTimeout(actions._rcT);
    actions._rcT = setTimeout(()=>{
      render();
      const el = byId('rcq');
      if(el){ el.focus(); const n = el.value.length; try{ el.setSelectionRange(n,n); }catch(_){} }
    }, 150);
  },
  rcClear(){
    S.rcq = ''; clearTimeout(actions._rcT); render();
    const el = byId('rcq'); if(el) el.focus();
  },
  back(){ S.tab='kitchen'; render(); },
  fire(id){
    const lv = parseInt(id,10);
    if(Sc.fireLevel === lv) return;
    Sc.fireLevel = lv;
    if(lv === 0) toast('灶火已关');
    else beep(420+lv*90, .08, 'triangle', .06);
    syncFire();
  }
};
function buyIng(k,n){
  const cost = ING[k].p*n;
  if(S.gold < cost){ toast('金币不够'); return; }
  S.gold -= cost; S.stock[k] = (S.stock[k]||0)+n;
  save(); render();
}
/* 做 n 份这道菜还缺哪些料、补齐要多少钱。
   list 里只放真正缺的（缺口 >0），已经够的不动 —— 不重复囤货。 */
function missOf(d, n){
  n = n || 1;
  const list = [];
  for(const [k,v] of Object.entries(d.ing)){
    const need = v*n, have = S.stock[k]||0;
    if(have < need) list.push({k, n:need-have, cost:ING[k].p*(need-have)});
  }
  let cost = 0; for(const it of list) cost += it.cost;
  return {list, cost};
}
/* 一键补齐：金币够就全买，不够则提示还差多少（不做半套，免得买一半还是做不了） */
function buyForDish(id, n){
  const d = dishOf(id); if(!d) return;
  const {list, cost} = missOf(d, n||1);
  if(!list.length){ toast('食材够了，可以直接开火'); return; }
  if(S.gold < cost){
    toast(`还差 💰${cost-S.gold}（补齐需要 ${cost}）`);
    return;
  }
  for(const it of list) S.stock[it.k] = (S.stock[it.k]||0) + it.n;
  S.gold -= cost; save();
  toast(`🛒 补齐 ${list.map(it=>ING[it.k].e+ING[it.k].n+'×'+it.n).join('、')} · 花费 💰${cost}`);
  render();
}
/* ===================== 菜品图鉴 =====================
   记录做过的菜、最好成绩、做过几份、完美几份，以及手法熟练度。 */
function viewBook(){
  const done = DISHES.filter(d=>S.book && S.book[d.id]);
  const total = DISHES.length;
  const perfect = DISHES.filter(d=>S.book && S.book[d.id] && S.book[d.id].best==='perfect').length;
  const masterDone = DISHES.filter(d=>d.master && S.book && S.book[d.id]).length;
  const masterAll = DISHES.filter(d=>d.master).length;
  let h = `<div class="card">
    <div class="spread"><div class="title">🏅 菜品图鉴</div>
    <span class="chip">${done.length} / ${total}</span></div>
    <div class="small" style="margin-top:6px">
      收录你做过的每一道菜：最好成绩、做过几份、拿过几次 ✨完美，以及手法熟练度。
    </div>
    <div class="row wrap" style="margin-top:8px">
      <span class="chip">✨ 完美 ${perfect}</span>
      <span class="chip master">👑 国宴 ${masterDone}/${masterAll}</span>
      <span class="chip">🍽️ 尝过 ${S.tasted||0}</span>
    </div></div>`;
  if(!done.length){
    return h + `<div class="card"><div class="small">还没做过菜。去菜谱开火做一道，做完就会收录进来。</div></div>`;
  }
  /* 熟练度高的排前面，方便看自己最拿手的是什么 */
  const list = done.slice().sort((a,b)=>{
    const ma = masteryOf(a.id), mb = masteryOf(b.id);
    if(mb!==ma) return mb-ma;
    return (GRADE[S.book[b.id].best]||GRADE.ok).lv - (GRADE[S.book[a.id].best]||GRADE.ok).lv;
  });
  for(const d of list){
    const e = S.book[d.id], G = GRADE[e.best]||GRADE.ok;
    const m = masteryOf(d.id);
    const pct = Math.round(m/30*100);
    const fast = Math.round((1-masterySpeed(d.id))*100);
    h += `<div class="card">
      <div class="spread">
        <div style="display:flex;gap:10px;align-items:flex-start">
          ${dishThumb(d)}
          <div style="min-width:0">
            <div class="iname">${d.e} ${esc(d.n)}${d.master?' <span class="chip master">国宴级</span>':''}</div>
            <div style="margin-top:3px">${stars(d.s,false)}</div>
            <div class="small" style="margin-top:3px;color:${G.c}">最好 ${G.e} ${G.n}</div>
          </div>
        </div>
        <div style="text-align:right">
          <div class="small">做过 <b>${e.times}</b> 份</div>
          <div class="small">✨ ${e.perfect} 次</div>
        </div>
      </div>
      <div style="margin-top:8px">
        <div class="small">手法熟练度 ${m}/30${m>=30?' · 已至纯熟':''}${fast>0?' · 节拍快 '+fast+'%':''}</div>
        <div style="margin-top:4px;height:5px;border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${m>=30?'#4ce39a':'#ffc247'};border-radius:3px"></div>
        </div>
      </div></div>`;
  }
  /* ---------- 黑暗料理：做砸了留下的失败产物 ---------- */
  const darkIds = Object.keys(S.dark||{});
  if(darkIds.length){
    const totalD = darkIds.reduce((a,k)=>a+((S.dark[k]&&S.dark[k].times)||0),0);
    h += `<div class="card" style="border-color:rgba(255,107,107,.35)">
      <div class="spread"><div class="title">💀 黑暗料理</div>
      <span class="chip">${darkIds.length} 道 · ${totalD} 次</span></div>
      <div class="small" style="margin-top:6px">
        做砸了留下的东西。不是菜谱，是事故记录——按失败的原因分类：炭化、夹生、不成形、碎尸、齁咸。
      </div></div>`;
    const KINDN = {burnt:'🔥 炭化', raw:'🧊 夹生', mess:'🌀 不成形', chop:'🔪 碎尸', bland:'🧂 齁咸'};
    for(const id of darkIds){
      const e = S.dark[id], d = dishOf(id); if(!d) continue;
      const kinds = Object.keys(e.kinds||{});
      h += `<div class="card">
        <div class="spread">
          <div class="iname">💀 ${esc(e.last||d.n)} <span class="small">原菜 ${d.e}${esc(d.n)}</span></div>
          <div style="text-align:right"><div class="small">砸了 <b>${e.times}</b> 次</div></div>
        </div>
        <div class="row wrap" style="margin-top:8px">
          ${kinds.map(k=>`<span class="chip no">${KINDN[k]||k} ×${e.kinds[k]}</span>`).join('')}
        </div></div>`;
    }
  }
  /* ---------- 人见打料理：明知离谱还要做 ---------- */
  const chaosDone = DISHES.filter(d=>d.chaos && S.book && S.book[d.id]);
  if(chaosDone.length){
    h += `<div class="card" style="border-color:rgba(255,107,107,.35)">
      <div class="spread"><div class="title">👊 人见打料理</div>
      <span class="chip">${chaosDone.length} / ${DISHES.filter(d=>d.chaos).length}</span></div>
      <div class="small" style="margin-top:6px">
        网上真实流传的作死搭配。不是做坏了，是从食材组合那一刻起就没打算正经。
      </div></div>`;
    for(const d of chaosDone){
      const e = S.book[d.id], G = GRADE[e.best]||GRADE.ok;
      h += `<div class="card">
        <div class="spread">
          <div class="iname">👊 ${d.e} ${esc(d.n)}</div>
          <div style="text-align:right">
            <div class="small">做过 <b>${e.times}</b> 份</div>
            <div class="small" style="color:${G.c}">最好 ${G.e} ${G.n}</div>
          </div>
        </div>
        <div class="small" style="margin-top:6px">${Object.entries(d.ing).map(([k,v])=>ING[k].e+ING[k].n+'×'+v).join('　')}</div>
      </div>`;
    }
  }
  return h;
}

  ${C('高分', `· 滑块单程匀速，判定点 = 画面动作的最高潮，可预判<br>
    · 一步里最多 2 个非完美 → ✨完美菜`)}
  `;
}

function renderReady(){
  const k = byId('cookhud'); if(!k) return;
  const sess = S.session, d = dishOf(sess.dishId);
  const ord = sess.orderId ? S.orders.find(o=>o.id===sess.orderId) : null;
  const max = Math.max(1, maxMake(d));
  const qty = ord ? 1 : Math.max(1, Math.min(max, S.pendingQty||1));
  S.pendingQty = qty;
  k.innerHTML = `
    <div>
      <div class="spread">
        <div><div class="title">${d.e} ${esc(d.n)}</div>
        <div class="small">${stars(d.s,!S.note)} · ${d.steps.length} 步 · 基准 💰${d.price}</div></div>
        <button class="btn mini gray" data-act="abort">取消</button>
      </div>
      <div class="row wrap" style="margin-top:8px">
        ${Object.entries(d.ing).map(([k2,v])=>`<span class="chip ${(S.stock[k2]||0)>=v?'':'no'}">${ING[k2].e}${ING[k2].n}×${v}</span>`).join('')}
      </div>
      <div class="small" style="margin-top:6px">流程：${flowOf(S.session).map(s=>STEPS[s].e+STEPS[s].n).join(' → ')}</div>
      ${ord?`<div class="card" style="margin-top:10px">
        <div class="kv"><span>订单 · ${esc(ord.c)}</span><b>${GRADEname(ord.req)} 以上</b></div>
        <div class="kv"><span>打包</span><b>${packIcon(ord)} ${packText(ord)}</b></div>
        <div class="kv"><span>报酬</span><b>💰${ord.gold} ＋ 🏅${ord.rep}</b></div></div>`
      :`<div class="small" style="margin-top:8px">做几份？（食材够做 ${max} 份）</div>
        <div class="qty">
          <button data-act="qty" data-id="-1">−</button>
          <div class="num">${qty}</div>
          <button data-act="qty" data-id="1">＋</button>
        </div>
        <div class="small" style="text-align:center">自由烹饪收入 ×0.7，接单收入更高</div>`}
      <button class="btn green" style="margin-top:12px" data-act="start">🔪 开工（${qty} 份）</button>
    </div>`;
  bindDynamic();
  Stage.mount('idle', d);
}

/* ===================== 初始化 ===================== */
document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click', ()=>{
    if(S.session && S.session.phase==='cook' && bar.on){ toast('灶上还炒着呢，先做完'); return; }
    const t = b.dataset.tab;
    // 再点一次当前页签 = 收起抽屉回到厨房
    S.tab = (S.tab === t && t !== 'kitchen') ? 'kitchen' : t;
    render();
  });
});
document.addEventListener('keydown', e=>{
  if(e.code==='Space' || e.key===' '){ e.preventDefault(); if(bar.on) judge(false); }
  if(e.key==='Shift') setSlow(true);
});
document.addEventListener('keyup', e=>{ if(e.key==='Shift') setSlow(false); });
function onViewportChange(){
  if(T3.cv) T3.resize();
  /* 顺带把画布的 CSS 尺寸钉到可见视口，彻底堵住底部黑条 */
  const st = byId('stage');
  if(st){
    /* 只往上取、绝不往下压：画布本来由 inset:0 撑满包含块，
       万一某些浏览器量出来偏小，就用可见视口补到更大，底部才不会露黑条。 */
    const r = st.getBoundingClientRect();
    st.style.width  = Math.max(r.width  || 0, window.innerWidth  || 0) + 'px';
    st.style.height = Math.max(r.height || 0, window.innerHeight || 0) + 'px';
    T3.resize();
  }
}
window.addEventListener('resize', onViewportChange);
window.addEventListener('orientationchange', ()=>setTimeout(onViewportChange, 250));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', onViewportChange);
}
onViewportChange();
/* 进游戏先把餐桌上的成品、柜子里的饮品摆出来（存档里可能还有） */
setTimeout(()=>{ syncTableDishes(); refreshCab(); }, 300);
load();
render();
window.addEventListener('beforeunload', save);

</script>
